# Written by `python -m tools.pypsa_compose` from the fragments under
# `examples/pypsa/`. Edit those, not this file.

version: 0
description: >-
  A plain `n.optimize()`, and its multi-period and stochastic classes, in one file.
  Every second-stage quantity spans a `scenario` (a future dispatch is chosen in) and every asset stands in the investment `period`s its build year and lifetime span.
  A parameter spans `scenario` exactly when PyPSA reads it per scenario.
  Capacity is chosen once, before the future is known, and paid once per active period at its cost in expectation over the scenarios; operation is the expectation over the scenarios' weights, with a share priced at the tail through the CVaR rows, which stand only where a risk preference is set.
  A plain run feeds one scenario, one period, all-active masks and unit weights, and the model collapses to the standard one.
  A security-constrained run copies each branch flow limit once per outage in an `outage` set that a plain run leaves empty.
  Which snapshots an asset is active in, a scenario's weight, and the outage factors are data prep.
dimensions:
  scenario:
    dtype: str
    description: the futures dispatch is chosen in, each with a weight
  snapshot:
    dtype: datetime
    ordered: true
    description: dispatch periods
  bus:
    dtype: str
    description: network nodes
  global_constraint:
    dtype: str
    description: PyPSA's `GlobalConstraint` rows, one label per declared limit
  period:
    dtype: int
    ordered: true
    description: investment periods — PyPSA's `investment_periods`
  carrier:
    dtype: str
    description: energy carriers, what a growth limit is set per
  cycle:
    dtype: str
    description: >-
      independent cycles of the passive network graph — the cycle basis, data prep.
      Each period has its own basis, of the branches that stand in it; a label is a position in that period's basis, so one label names a different cycle in another period
  line:
    dtype: str
    description: passive branches, each between two buses, their flow set by impedance
  transformer:
    dtype: str
    description: passive branches between two buses, their flow set by impedance and tap ratio, with a phase shift fixed or optimised
  outage:
    dtype: str
    description: the passive branches a security-constrained run takes out one at a time — PyPSA's `branch_outages`, each a line or a transformer; none on a plain run
  generator:
    dtype: str
    description: generating units, each on one bus
  link:
    dtype: str
    description: controllable connections, each from one bus to the buses it delivers to
  link_output:
    dtype: str
    description: a link's output ports, one label per port a link declares — PyPSA's `bus1`, `bus2`, … columns read long, so a link of any number of output ports is one term in the balance, data prep
  process:
    dtype: str
    description: generalized multi-port converters, each with an internal power that every port draws or delivers at its own rate
  process_output:
    dtype: str
    description: a process's ports, one label per port a process declares — PyPSA's `bus0`, `bus1`, … each carry a signed `rate`, so a process of any number of ports is one term in the balance, data prep
  storage_unit:
    dtype: str
    description: storage units, dispatch and store behind one bus connection
  store:
    dtype: str
    description: pure energy stores, each on one bus
  segment:
    dtype: int
    description: the cuts a passive branch's loss curve is held above — PyPSA's tangents, as many as its `segments` count, or its secants, as many as its tolerance loop places; none in a lossless run
  load:
    dtype: str
    description: demands, each on one bus
relations:
  snapshot_period:
    key: snapshot
    values: period
    description: the investment period a snapshot falls in
  Outage_line:
    key: outage
    values: line
    missing: absent
    description: the line an outage takes out; an outage of a transformer has no row
  Outage_transformer:
    key: outage
    values: transformer
    missing: absent
    description: the transformer an outage takes out; an outage of a line has no row
  Generator_carrier:
    key: generator
    values: carrier
    description: the carrier a generator converts from
  Generator_bus:
    key: generator
    values: bus
    description: the bus a generator sits on
  Generator_maintenance_cover:
    key: {scenario: scenario, generator: generator, start: snapshot, covered: snapshot}
    missing: absent
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario, the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`, data prep; no rows for a generator that is not maintainable
  Link_carrier:
    key: link
    values: carrier
    description: the carrier a link converts from
  Link_bus0:
    key: link
    values: bus
    description: the bus a link leaves
  Link_output_link:
    key: link_output
    values: link
    description: the link an output port belongs to
  Link_output_bus:
    key: link_output
    values: bus
    description: >-
      the bus an output port delivers to — PyPSA's `bus1`, `bus2`, … columns.
      A link of three output ports is three labels here rather than a third relation, so the file states any number of them
  Link_maintenance_cover:
    key: {scenario: scenario, link: link, start: snapshot, covered: snapshot}
    missing: absent
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario, the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`, data prep; no rows for a link that is not maintainable
  Process_carrier:
    key: process
    values: carrier
    description: the carrier a process converts from
  Process_output_process:
    key: process_output
    values: process
    description: the process a port belongs to
  Process_output_bus:
    key: process_output
    values: bus
    description: >-
      the bus a port draws from or delivers to — PyPSA's `bus0`, `bus1`, … columns.
      A process of three ports is three labels here rather than a third relation, so the file states any number of them
  Process_maintenance_cover:
    key: {scenario: scenario, process: process, start: snapshot, covered: snapshot}
    missing: absent
    description: the snapshots a maintenance event covers, by the snapshot it starts in — in a scenario, the start and the snapshots after it, until their generator weightings reach that scenario's `maintenance_duration`, data prep; no rows for a process that is not maintainable
  StorageUnit_carrier:
    key: storage_unit
    values: carrier
    description: the carrier a storage unit converts from
  StorageUnit_bus:
    key: storage_unit
    values: bus
    description: the bus a storage unit sits on
  Store_carrier:
    key: store
    values: carrier
    description: the carrier a store holds
  Store_bus:
    key: store
    values: bus
    description: the bus a store sits on
  Line_carrier:
    key: line
    values: carrier
    description: the carrier a line carries
  Line_bus0:
    key: line
    values: bus
    description: the bus a line's flow is measured at
  Line_bus1:
    key: line
    values: bus
    description: the bus at a line's other end
  Transformer_bus0:
    key: transformer
    values: bus
    description: the bus a transformer's flow is measured at
  Transformer_bus1:
    key: transformer
    values: bus
    description: the bus at a transformer's other end
  Load_bus:
    key: load
    values: bus
    description: the bus a load sits on
parameters:
  snapshot_weightings_objective:
    dims: [snapshot]
    dtype: float
    description: PyPSA's `snapshot_weightings.objective` — hours a snapshot stands for in the cost
  scenario_weight:
    dims: [scenario]
    dtype: float
    description: PyPSA's `scenario_weightings.weight` — the probability of a future
  CVaR_omega:
    dims: []
    dtype: float
    missing: neutral
    description: >-
      PyPSA's `risk_preference['omega']` — the share of operating cost priced at the tail rather than in expectation.
      Data prep writes a row only where a risk preference is set.
      Without a risk preference, the file has no CVaR variables or rows.
      With `omega = 0`, PyPSA builds them, and the optimum is the risk-neutral one
  period_weight_objective:
    dims: [period]
    dtype: float
    description: PyPSA's `investment_period_weightings.objective` — what a period's cost weighs; PyPSA reads it only under `multi_investment_periods`, so data prep feeds one otherwise, whatever the column holds (`optimize.py:205-207`, `:264-266`)
  period_weight_years:
    dims: [period]
    dtype: float
    description: PyPSA's `investment_period_weightings.years` — what a period's energy weighs in a `primary_energy` or `operational_limit` row; PyPSA reads it only under `multi_investment_periods`, so data prep feeds one otherwise
  snapshot_weightings_stores:
    dims: [snapshot]
    dtype: float
    description: PyPSA's `snapshot_weightings.stores` — hours a snapshot stands for in a storage balance
  snapshot_weightings_generators:
    dims: [snapshot]
    dtype: float
    description: PyPSA's `snapshot_weightings.generators` — hours a snapshot stands for in an energy total
  transmission_losses:
    dims: []
    dtype: bool
    description: >-
      whether the network dissipates transmission losses — PyPSA's `transmission_losses` read as a flag; its mode, tangents or secants, only decides how data prep fills the `segment` axis, the rows are the same; false with no segments is a lossless run.
      A security-constrained run over a network with passive branches builds no loss: PyPSA does not hand the keyword to `create_model` (`abstract.py:528-532`) but to the solver (`:548`), so data prep feeds false there
  GlobalConstraint_counts_snapshot:
    dims: [scenario, global_constraint, snapshot]
    dtype: bool
    missing: neutral
    description: >-
      whether a row counts a snapshot in a scenario — PyPSA's `investment_period`: every snapshot where the row names none, and only that period's where it names one, data prep.
      A row that names a period the run does not model has no label here, as PyPSA skips it (`global_constraints.py:372`); PyPSA reads the column only under `multi_investment_periods`, and fails on a row that names a period without it (`global_constraints.py:364-369`)
  CVaR_alpha:
    dims: []
    dtype: float
    missing: neutral
    description: >-
      PyPSA's `risk_preference['alpha']` — the confidence level; the tail holds the other `1 - alpha` of the probability.
      Data prep writes a row where it writes `CVaR_omega`
  Carrier_max_growth:
    dims: [carrier]
    dtype: float
    missing: neutral
    description: >-
      most capacity of a carrier that may be added in a period; no value means no limit.
      The least over the scenarios, as PyPSA takes it (`global_constraints.py:227-231`), data prep.
      PyPSA reads it only under `multi_investment_periods` (`global_constraints.py:220-221`), so data prep feeds no value otherwise
  Carrier_max_relative_growth:
    dims: [carrier]
    dtype: float
    description: share of the previous period's additions that may be added on top — the least over the scenarios, as PyPSA takes it, data prep
  GlobalConstraint_type:
    dims: [global_constraint]
    dtype: str
    description: which formula the row takes — `primary_energy`, `operational_limit`, `transmission_volume_expansion_limit`, `transmission_expansion_cost_limit` or `tech_capacity_expansion_limit`
  GlobalConstraint_sense:
    dims: [scenario, global_constraint]
    dtype: str
    description: which way the row binds in each scenario — `<=`, `>=` or `==`; PyPSA reads a row's sense per scenario (`global_constraints.py:551`, `:749`, `:829`)
  GlobalConstraint_constant:
    dims: [scenario, global_constraint]
    dtype: float
    description: >-
      the constant the total is held against; what a variable cannot carry — an initial charge, times its period's years for each counted period where the storage reopens per period, or a non-extendable build — is folded in here by data prep.
      PyPSA reads it per scenario (`global_constraints.py:552`, `:750`, `:829`)
  Line_BODF:
    dims: [period, line, outage]
    dtype: float
    missing: neutral
    description: >-
      the share of an outaged branch's flow a line takes on when that branch goes out — PyPSA's `BODF`, from the PTDF of the sub-network the period's active branches form, data prep; a row only where the line and the outage are active in the period and share a sub-network, -1 at the outaged line itself.
      The factors are the same in every scenario, because PyPSA takes those of the first scenario (`abstract.py:534`)
  Transformer_BODF:
    dims: [period, transformer, outage]
    dtype: float
    missing: neutral
    description: the share of an outaged branch's flow a transformer takes on when that branch goes out, as a line's; a row only where the transformer and the outage are active in the period and share a sub-network
  Generator_p_nom:
    dims: [scenario, generator]
    dtype: float
    description: nominal power
  Generator_p_nom_extendable:
    dims: [generator]
    dtype: bool
    description: whether the nominal power is a decision
  Generator_p_min_pu:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: least output, per unit of nominal power
  Generator_p_max_pu:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: most output, per unit of nominal power — an availability profile
  Generator_marginal_cost:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: cost of one unit of output
  Generator_marginal_cost_quadratic:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: cost of the square of one unit of output
  Generator_sign:
    dims: [generator]
    dtype: float
    description: >-
      the sign output enters its bus's balance with — PyPSA's `sign`, `1` unless given, `-1` for a unit that draws power.
      PyPSA refuses one that differs by scenario (`constants.py:43`)
  Generator_p_nom_mod:
    dims: [generator]
    dtype: float
    missing: neutral
    description: the module size a build comes in whole numbers of; no value means the build is continuous
  Generator_modules_installed:
    dims: [scenario, generator]
    dtype: float
    description: >-
      how many whole modules a committable build has in place: `Generator_p_nom / Generator_p_nom_mod` where a fixed build is modular, one where it is not, data prep.
      PyPSA refuses a fixed modular build whose nominal power is not a whole number of modules
  Generator_p_min_pu_nonneg:
    dims: [generator]
    dtype: bool
    description: true where none of the generator's own minimums-per-unit is negative — PyPSA's per-unit `(p_min_pu >= 0).all()` over every snapshot and scenario, data prep
  Generator_active:
    dims: [snapshot, generator]
    dtype: bool
    description: whether a generator stands in a snapshot's period — PyPSA's `active`, from build year and lifetime, data prep
  Generator_active_asset:
    dims: [generator]
    dtype: bool
    description: >-
      whether a generator is one of PyPSA's `active_assets` — its `active` flag alone, without build year and lifetime, so a unit that stands in no snapshot of the horizon still counts.
      PyPSA refuses one that differs by scenario (`constants.py:51`)
  Generator_capital_weight:
    dims: [generator]
    dtype: float
    description: the sum of period weights a generator stands in — PyPSA's `active * period_weighting`, summed, data prep
  Generator_first_active:
    dims: [period, generator]
    dtype: float
    description: >-
      one in the first period a generator stands in, zero elsewhere, data prep.
      PyPSA takes `active & (active.cumsum() == 1)` (`global_constraints.py:265`)
  Generator_p_set:
    dims: [scenario, snapshot, generator]
    dtype: float
    missing: neutral
    description: a given output schedule; a generator without one has no row here
  Generator_p_nom_min:
    dims: [scenario, generator]
    dtype: float
    description: least nominal power an extendable generator may be built at
  Generator_p_nom_max:
    dims: [scenario, generator]
    dtype: float
    description: most nominal power an extendable generator may be built at
  Generator_capital_cost:
    dims: [scenario, generator]
    dtype: float
    description: 'cost of one unit of nominal power for the modelled horizon — PyPSA''s `periodized_cost`: `overnight_cost` as an annuity over `lifetime` at `discount_rate`, times `nyears`, where it is given, and `capital_cost` where it is not, plus `fom_cost` (`components.py:1126-1147`, `costs.py:102-203`), data prep'
  Generator_p_nom_set:
    dims: [generator]
    dtype: float
    missing: neutral
    description: a given nominal power for an extendable generator; one without a value has no row here
  Generator_e_sum_min:
    dims: [scenario, generator]
    dtype: float
    description: least energy over the horizon; minus infinity where no floor is meant
  Generator_e_sum_max:
    dims: [scenario, generator]
    dtype: float
    description: most energy over the horizon — a fuel or emission budget in energy terms; infinity where no cap is meant
  Generator_primary_energy_weight:
    dims: [scenario, global_constraint, snapshot, generator]
    dtype: float
    missing: neutral
    description: the constrained attribute per unit of energy at the bus — the carrier's `co2_emissions` over the generator's efficiency at the snapshot, data prep; a generator of an unweighted carrier has no row
  Generator_operational_limit_weight:
    dims: [scenario, global_constraint, generator]
    dtype: float
    missing: neutral
    description: one where the generator is in the row's set — data prep; one outside it has no row
  Generator_tech_capacity_weight:
    dims: [global_constraint, generator]
    dtype: float
    missing: neutral
    description: one where the generator is in the row's carrier-and-bus set — data prep; one outside it, or one that does not stand in the row's `investment_period`, has no row
  Generator_committable:
    dims: [generator]
    dtype: bool
    description: whether output is gated by an on/off status decision
  Generator_min_up_time:
    dims: [scenario, generator]
    dtype: int
    description: least snapshots a unit stays on once started
  Generator_min_down_time:
    dims: [scenario, generator]
    dtype: int
    description: least snapshots a unit stays off once stopped
  Generator_status_initial:
    dims: [scenario, generator]
    dtype: int
    description: one where the unit was on before the first snapshot, zero where off — PyPSA's `up_time_before > 0`, data prep
  Generator_must_stay_up:
    dims: [scenario, snapshot, generator]
    dtype: bool
    description: true while the up time a unit brought into the horizon still binds — data prep, since `position()` compares against a literal rather than a parameter
  Generator_must_stay_down:
    dims: [scenario, snapshot, generator]
    dtype: bool
    description: true while the down time a unit brought into the horizon still binds — PyPSA's `min_down_time - down_time_before` snapshots, where `down_time_before > 0`, data prep for the same reason
  Generator_start_up_cost:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: cost of one start in this snapshot
  Generator_shut_down_cost:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: cost of one stop in this snapshot
  Generator_stand_by_cost:
    dims: [scenario, snapshot, generator]
    dtype: float
    description: cost of one snapshot spent on
  Generator_big_m:
    dims: [scenario, generator]
    dtype: float
    missing: neutral
    description: >-
      the bound a committed extendable generator's big-M rows release it by — the build cap `p_nom_max` times the highest `p_max_pu`, where the cap is finite and positive.
      Elsewhere it is `committable_big_m` times the highest `p_max_pu`, and where that keyword is not given, ten times the largest of the peak total load and the component's largest finite `p_nom` and `p_nom_max`, or 1e6 where there is none of them (`components.py:1050-1121`).
      Below the output a solve wants, it caps that output; data prep
  Generator_ramp_limit_up:
    dims: [scenario, snapshot, generator]
    dtype: float
    missing: neutral
    description: most a generator may raise its output between snapshots, per unit of nominal power; no value means no limit — read at the later of the two snapshots, so the limit may change over time
  Generator_ramp_limit_down:
    dims: [scenario, snapshot, generator]
    dtype: float
    missing: neutral
    description: most a generator may lower its output between snapshots, per unit of nominal power; no value means no limit — read at the later of the two snapshots, so the limit may change over time
  Generator_ramp_limit_start_up:
    dims: [scenario, generator]
    dtype: float
    missing: neutral
    description: most output in the snapshot a unit starts, per unit of nominal power; no value means no limit
  Generator_ramp_limit_shut_down:
    dims: [scenario, generator]
    dtype: float
    missing: neutral
    description: most output in the snapshot before a unit stops, per unit of nominal power; no value means no limit
  Generator_p_init:
    dims: [scenario, generator]
    dtype: float
    missing: neutral
    description: the output a unit brought into the horizon — PyPSA's `p_init`, read only where the unit came in running; no value means it is unknown, so the unit carries no ramp row at the first snapshot
  Generator_maintainable:
    dims: [generator]
    dtype: bool
    description: whether a generator must be taken off for maintenance within the horizon — in any scenario, as PyPSA takes the union over them (`components.py:1016-1019`)
  Generator_maintenance_pu:
    dims: [scenario, generator]
    dtype: float
    description: the share of the build a maintenance event takes off
  Generator_maintenance_events:
    dims: [scenario, generator]
    dtype: int
    description: how many maintenance events the horizon holds
  Generator_maintenance_duration:
    dims: [scenario, generator]
    dtype: float
    missing: neutral
    description: >-
      the hours of generator weightings one maintenance event covers — PyPSA's `maintenance_duration`; no value where the generator is not maintainable.
      No row reads it: data prep turns it into `Generator_maintenance_cover` and `Generator_maintenance_start_blocked`, and the assumptions hold it to the horizon
  Generator_maintenance_start_blocked:
    dims: [scenario, snapshot, generator]
    dtype: bool
    description: true where no maintenance event may start, because the snapshots it would cover run past the end of the horizon or into one the generator does not stand in — PyPSA's `active & ~valid`, from `maintenance_duration` and the generator weightings, data prep
  Link_p_nom:
    dims: [scenario, link]
    dtype: float
    description: nominal power
  Link_p_nom_extendable:
    dims: [link]
    dtype: bool
    description: whether the nominal power is a decision
  Link_p_min_pu:
    dims: [scenario, snapshot, link]
    dtype: float
    description: least flow, per unit of nominal power — negative for a link that carries both ways
  Link_p_max_pu:
    dims: [scenario, snapshot, link]
    dtype: float
    description: most flow, per unit of nominal power
  Link_efficiency:
    dims: [scenario, snapshot, link_output]
    dtype: float
    description: >-
      share of the flow that arrives at an output port, PyPSA's `efficiency`, `efficiency2`, … read long — negative where that port consumes rather than delivers.
      Read at the snapshot the flow arrives, so a delayed port delivers at its arrival snapshot's efficiency (`constraints.py:1498`)
  Link_output_delay:
    dims: [link_output]
    dtype: int
    description: >-
      snapshots a port's delivery lags its link's flow — PyPSA's `delay`, `delay2`, … read long, divided by the `snapshot_weightings.generators` value and rounded up in data prep; zero for a port that delivers at once.
      A port has the same delay in every scenario, because PyPSA refuses a delay that differs by scenario (`constants.py:52`)
  Link_output_cyclic_delay:
    dims: [link_output]
    dtype: bool
    description: >-
      whether a delayed port's flow wraps from the end of its investment period — PyPSA's `cyclic_delay`, `cyclic_delay2`, …; where it does not, the flow still in transit at each period's first snapshots is lost.
      The flag is the same in every scenario, as the delay is
  Link_marginal_cost:
    dims: [scenario, snapshot, link]
    dtype: float
    description: cost of one unit of flow
  Link_marginal_cost_quadratic:
    dims: [scenario, snapshot, link]
    dtype: float
    description: cost of the square of one unit of flow
  Link_p_nom_mod:
    dims: [link]
    dtype: float
    missing: neutral
    description: the module size a build comes in whole numbers of; no value means the build is continuous
  Link_modules_installed:
    dims: [scenario, link]
    dtype: float
    description: >-
      how many whole modules a committable build has in place: `Link_p_nom / Link_p_nom_mod` where a fixed build is modular, one where it is not, data prep.
      PyPSA refuses a fixed modular build whose nominal power is not a whole number of modules
  Link_p_min_pu_nonneg:
    dims: [link]
    dtype: bool
    description: true where none of the link's own minimums-per-unit is negative — PyPSA's per-unit `(p_min_pu >= 0).all()` over every snapshot and scenario, data prep
  Link_active:
    dims: [snapshot, link]
    dtype: bool
    description: whether a link stands in a snapshot's period — PyPSA's `active`, data prep
  Link_active_asset:
    dims: [link]
    dtype: bool
    description: >-
      whether a link is one of PyPSA's `active_assets` — its `active` flag alone, without build year and lifetime, so a unit that stands in no snapshot of the horizon still counts.
      PyPSA refuses one that differs by scenario (`constants.py:51`)
  Link_capital_weight:
    dims: [link]
    dtype: float
    description: the sum of period weights a link stands in — PyPSA's `active * period_weighting`, summed, data prep
  Link_first_active:
    dims: [period, link]
    dtype: float
    description: >-
      one in the first period a link stands in, zero elsewhere, data prep.
      PyPSA takes `active & (active.cumsum() == 1)` (`global_constraints.py:265`)
  Link_p_set:
    dims: [scenario, snapshot, link]
    dtype: float
    missing: neutral
    description: a given flow schedule; a link without one has no row here
  Link_p_nom_min:
    dims: [scenario, link]
    dtype: float
    description: least nominal power an extendable link may be built at
  Link_p_nom_max:
    dims: [scenario, link]
    dtype: float
    description: most nominal power an extendable link may be built at
  Link_capital_cost:
    dims: [scenario, link]
    dtype: float
