    dims: [scenario, snapshot, store]
    dtype: float
    description: share of energy kept over a snapshot — PyPSA's `(1 - standing_loss) ** elapsed hours`, data prep
  Store_e_initial:
    dims: [scenario, store]
    dtype: float
    description: energy held before the first snapshot
  Store_e_cyclic:
    dims: [scenario, store]
    dtype: bool
    description: whether the horizon closes on itself instead of opening on the initial energy
  Store_e_cyclic_per_period:
    dims: [scenario, store]
    dtype: bool
    description: >-
      whether each investment period closes on itself instead of carrying its energy on to the next; it overrides `e_cyclic` and `e_initial_per_period`.
      PyPSA reads it only under `multi_investment_periods`, so data prep feeds false otherwise
  Store_e_initial_per_period:
    dims: [scenario, store]
    dtype: bool
    description: whether each investment period opens on the initial energy instead of carrying the previous period's; PyPSA reads it only under `multi_investment_periods`, so data prep feeds false otherwise
  Store_opens_late:
    dims: [snapshot, store]
    dtype: bool
    description: whether a snapshot is the first a store stands in, where that is not the first of the horizon — PyPSA's `active.cumsum() == 1` over the snapshots it stands in, past the first snapshot, data prep; false in a run where every store stands throughout
  Store_inactive_snapshots:
    dims: [store]
    dtype: int
    description: >-
      how many snapshots a store does not stand in — PyPSA's `(~active).sum()`, data prep.
      A cyclic store reaches back this many snapshots further, so it closes on the last snapshot it stands in
  Store_marginal_cost:
    dims: [scenario, snapshot, store]
    dtype: float
    description: cost of one unit of power delivered
  Store_marginal_cost_quadratic:
    dims: [scenario, snapshot, store]
    dtype: float
    description: cost of the square of the net power delivered, so charging costs as much as delivering
  Store_marginal_cost_storage:
    dims: [scenario, snapshot, store]
    dtype: float
    description: cost of one unit of energy held over one snapshot
  Store_e_set:
    dims: [scenario, snapshot, store]
    dtype: float
    missing: neutral
    description: a given energy schedule; a store without one has no row here
  Store_p_set:
    dims: [scenario, snapshot, store]
    dtype: float
    missing: neutral
    description: a given schedule of power delivered; a store without one has no row here
  Store_primary_energy_weight:
    dims: [scenario, global_constraint, store]
    dtype: float
    missing: neutral
    description: the constrained attribute per unit of energy depleted — data prep; an unweighted store has no row
  Store_operational_limit_weight:
    dims: [scenario, global_constraint, store]
    dtype: float
    missing: neutral
    description: one where the store is in the row's set — data prep; one outside it has no row
  Store_tech_capacity_weight:
    dims: [global_constraint, store]
    dtype: float
    missing: neutral
    description: one where the store is in the row's carrier-and-bus set — data prep; one outside it, or one that does not stand in the row's `investment_period`, has no row
  Line_active:
    dims: [snapshot, line]
    dtype: bool
    description: whether a line stands in a snapshot's period — PyPSA's `active`, data prep
  Line_active_asset:
    dims: [line]
    dtype: bool
    description: >-
      whether a line is one of PyPSA's `active_assets` — its `active` flag alone, without build year and lifetime, so a unit that stands in no snapshot of the horizon still counts.
      PyPSA refuses one that differs by scenario (`constants.py:51`)
  Line_capital_weight:
    dims: [line]
    dtype: float
    description: the sum of period weights a line stands in — PyPSA's `active * period_weighting`, summed, data prep
  Line_first_active:
    dims: [period, line]
    dtype: float
    description: >-
      one in the first period a line stands in, zero elsewhere, data prep.
      PyPSA takes `active & (active.cumsum() == 1)` (`global_constraints.py:265`)
  Line_s_nom:
    dims: [scenario, line]
    dtype: float
    description: nominal apparent power
  Line_s_nom_extendable:
    dims: [line]
    dtype: bool
    description: whether the nominal apparent power is a decision
  Line_s_nom_mod:
    dims: [line]
    dtype: float
    missing: neutral
    description: the module size a build comes in whole numbers of; no value means the build is continuous
  Line_s_max_pu:
    dims: [scenario, snapshot, line]
    dtype: float
    description: most flow either way, per unit of nominal apparent power
  Line_s_nom_min:
    dims: [scenario, line]
    dtype: float
    description: least nominal apparent power an extendable line may be built at
  Line_s_nom_max:
    dims: [scenario, line]
    dtype: float
    description: most nominal apparent power an extendable line may be built at
  Line_capital_cost:
    dims: [scenario, line]
    dtype: float
    description: 'cost of one unit of nominal apparent power for the modelled horizon — PyPSA''s `periodized_cost`: `overnight_cost` as an annuity over `lifetime` at `discount_rate`, times `nyears`, where it is given, and `capital_cost` where it is not, plus `fom_cost` (`components.py:1126-1147`, `costs.py:102-203`), data prep'
  Line_s_nom_set:
    dims: [line]
    dtype: float
    missing: neutral
    description: a given nominal apparent power for an extendable line; one without a value has no row here
  Line_s_set:
    dims: [scenario, snapshot, line]
    dtype: float
    missing: neutral
    description: a given flow schedule; a line without one has no row here
  Line_v_ang_max:
    dims: [scenario, line]
    dtype: float
    missing: neutral
    description: >-
      the most the voltage angle difference across a line may be either way, in degrees — PyPSA's `v_ang_max`; infinite, and so no row, by default.
      A line whose carrier is not AC has no row either.
      The deprecated `v_ang_min` is ignored, as PyPSA ignores it with a `DeprecationWarning` (`constraints.py:1702-1709`)
  Line_x_pu_eff:
    dims: [scenario, line]
    dtype: float
    description: the line's effective series reactance — PyPSA's `x_pu_eff`, `x` over the square of its bus's nominal voltage, data prep
  Line_cycle_weight:
    dims: [period, line, cycle]
    dtype: float
    missing: neutral
    description: >-
      the line's series impedance, signed by its orientation in the cycle — the cycle basis, data prep; a line in no cycle has no row.
      PyPSA builds the cycle basis from the first scenario only (`networks.py:1430-1437`)
  Line_loss_max:
    dims: [scenario, snapshot, line]
    dtype: float
    description: the loss at a line's rating — PyPSA's `r_pu_eff * (s_max_pu * s_nom_max)**2`, data prep
  Line_loss_slope:
    dims: [scenario, snapshot, line, segment]
    dtype: float
    description: the slope of a cut to the loss curve — a tangent's `2 * r_pu_eff * p_k` at its segment's flow, a secant's `r_pu_eff * (p_k + p_k+1)` between consecutive breakpoints, data prep
  Line_loss_offset:
    dims: [scenario, snapshot, line, segment]
    dtype: float
    description: where that cut meets the loss axis — a tangent's `loss_k - slope_k * p_k`, a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
  Line_volume_weight:
    dims: [scenario, global_constraint, line]
    dtype: float
    missing: neutral
    description: the line's length in each scenario where its carrier is in the row's set (`global_constraints.py:847-848`) — data prep; a line outside it, or one that does not stand in the row's `investment_period`, has no row
  Line_expansion_cost_weight:
    dims: [scenario, global_constraint, line]
    dtype: float
    missing: neutral
    description: >-
      the line's capital cost where its carrier is in the row's set, times the objective weights of the periods it stands in where the row names no `investment_period` under `multi_investment_periods` — data prep; a line outside the set, or one that does not stand in the row's period, has no row.
      The capital cost is PyPSA's `capital_cost` property, which is `Line_capital_cost` without `fom_cost` (`components.py:1151-1169`, `global_constraints.py:870-879`)
  Line_tech_capacity_weight:
    dims: [global_constraint, line]
    dtype: float
    missing: neutral
    description: one where the line is in the row's carrier-and-bus set — data prep; one outside it, or one that does not stand in the row's `investment_period`, has no row
  Transformer_active:
    dims: [snapshot, transformer]
    dtype: bool
    description: whether a transformer stands in a snapshot's period — PyPSA's `active`, data prep
  Transformer_active_asset:
    dims: [transformer]
    dtype: bool
    description: >-
      whether a transformer is one of PyPSA's `active_assets` — its `active` flag alone, without build year and lifetime, so a unit that stands in no snapshot of the horizon still counts.
      PyPSA refuses one that differs by scenario (`constants.py:51`)
  Transformer_capital_weight:
    dims: [transformer]
    dtype: float
    description: the sum of period weights a transformer stands in — PyPSA's `active * period_weighting`, summed, data prep
  Transformer_s_nom:
    dims: [scenario, transformer]
    dtype: float
    description: nominal apparent power
  Transformer_s_nom_extendable:
    dims: [transformer]
    dtype: bool
    description: whether the nominal apparent power is a decision
  Transformer_s_nom_mod:
    dims: [transformer]
    dtype: float
    missing: neutral
    description: the module size a build comes in whole numbers of; no value means the build is continuous
  Transformer_s_max_pu:
    dims: [scenario, snapshot, transformer]
    dtype: float
    description: most flow either way, per unit of nominal apparent power
  Transformer_s_nom_min:
    dims: [scenario, transformer]
    dtype: float
    description: least nominal apparent power an extendable transformer may be built at
  Transformer_s_nom_max:
    dims: [scenario, transformer]
    dtype: float
    description: most nominal apparent power an extendable transformer may be built at
  Transformer_capital_cost:
    dims: [scenario, transformer]
    dtype: float
    description: 'cost of one unit of nominal apparent power for the modelled horizon — PyPSA''s `periodized_cost`: `overnight_cost` as an annuity over `lifetime` at `discount_rate`, times `nyears`, where it is given, and `capital_cost` where it is not, plus `fom_cost` (`components.py:1126-1147`, `costs.py:102-203`), data prep'
  Transformer_s_nom_set:
    dims: [transformer]
    dtype: float
    missing: neutral
    description: a given nominal apparent power for an extendable transformer; one without a value has no row here
  Transformer_s_set:
    dims: [scenario, snapshot, transformer]
    dtype: float
    missing: neutral
    description: a given flow schedule; a transformer without one has no row here
  Transformer_v_ang_max:
    dims: [scenario, transformer]
    dtype: float
    missing: neutral
    description: >-
      the most the voltage angle difference across a transformer, its phase shift included, may be either way, in degrees — PyPSA's `v_ang_max`; infinite, and so no row, by default.
      The deprecated `v_ang_min` is ignored, as a line's
  Transformer_x_pu_eff:
    dims: [scenario, transformer]
    dtype: float
    description: the transformer's effective series reactance — PyPSA's `x_pu_eff`, `x` over its `s_nom` times its tap ratio, data prep
  Transformer_cycle_weight:
    dims: [period, transformer, cycle]
    dtype: float
    missing: neutral
    description: >-
      the transformer's effective series reactance, `x` times its tap ratio, signed by its orientation in the cycle — PyPSA's `x_pu_eff`, the cycle basis, data prep; a transformer in no cycle has no row.
      From the first scenario only, as a line's
  Transformer_phase_shift_weight:
    dims: [snapshot, transformer, cycle]
    dtype: float
    missing: neutral
    description: >-
      a fixed transformer's phase shift in radians at each snapshot, signed by its orientation in the cycle — a constant added to the cycle sum, data prep; zero for a varying transformer, whose shift is a decision instead, so the constant and the variable term never both count a shift.
      A transformer with no shift or in no cycle of its snapshot's period has no row
  Transformer_phase_shift_varying:
    dims: [transformer]
    dtype: bool
    description: >-
      whether a transformer's phase shift is a decision — PyPSA's `phase_shift_min < phase_shift_max`, read as a flag in data prep; false is a fixed shift carried by `phase_shift`.
      The shift parameters carry no scenario, but PyPSA reads them per scenario (`variables.py:433-443`, `constraints.py:1652`, `:1735`), so the spec and PyPSA differ here (#783)
  Transformer_phase_shift_min:
    dims: [transformer]
    dtype: float
    description: the least a varying transformer's phase shift may take, in degrees — PyPSA's `phase_shift_min`; where it is below `phase_shift_max` the shift is a decision, otherwise the transformer keeps its fixed `phase_shift`
  Transformer_phase_shift_max:
    dims: [transformer]
    dtype: float
    description: the most a varying transformer's phase shift may take, in degrees — PyPSA's `phase_shift_max`; equal to `phase_shift_min` for a fixed transformer
  Transformer_phase_shift_fixed:
    dims: [snapshot, transformer]
    dtype: float
    description: a fixed transformer's phase shift at each snapshot, in degrees — PyPSA's `phase_shift`, zero by default; a varying transformer's shift is a decision instead
  Transformer_phase_shift_cycle_weight:
    dims: [period, transformer, cycle]
    dtype: float
    description: the cycle sign for a varying transformer's phase shift, times π/180 so a shift in degrees enters the cycle sum in radians — data prep; zero for a fixed transformer or one in no cycle
  Transformer_loss_max:
    dims: [scenario, snapshot, transformer]
    dtype: float
    description: the loss at a transformer's rating — PyPSA's `r_pu_eff * (s_max_pu * s_nom_max)**2`, its `r_pu_eff` the resistance over the given `s_nom` times the tap ratio, data prep
  Transformer_loss_slope:
    dims: [scenario, snapshot, transformer, segment]
    dtype: float
    description: the slope of a cut to a transformer's loss curve — a tangent's `2 * r_pu_eff * p_k`, a secant's `r_pu_eff * (p_k + p_k+1)`, as a line's, over the transformer's own `r_pu_eff` and rating, data prep
  Transformer_loss_offset:
    dims: [scenario, snapshot, transformer, segment]
    dtype: float
    description: where that cut meets the loss axis — a tangent's `loss_k - slope_k * p_k`, a secant's `-r_pu_eff * p_k * p_k+1`, negative, data prep
  Load_p_set: {dims: [scenario, snapshot, load], dtype: float, description: demand}
  Load_sign:
    dims: [load]
    dtype: float
    description: >-
      the sign a load's demand enters its bus's balance with — PyPSA's `sign`, `-1` unless given, `1` for a load that feeds its bus.
      PyPSA refuses one that differs by scenario (`constants.py:43`)
  Load_active:
    dims: [load]
    dtype: bool
    description: >-
      whether a load stands in the model — PyPSA's `active`.
      A load has no build year and no lifetime, so the flag holds in every snapshot.
      PyPSA refuses one that differs by scenario (`constants.py:51`)
masks:
  Generator_committed:
    where: Generator_committable AND Generator_active
    description: a committable generator that stands in the snapshot's period — every unit-commitment row's set
  Generator_com_ext:
    where: Generator_committable AND Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0) AND Generator_active
    description: a committable generator with an extendable, non-modular build that stands in the snapshot's period — PyPSA's `com-ext` rows, whose status is relaxed against the chosen build
  Generator_ramps_from_previous:
    where: position(snapshot, within=snapshot_period[period]) > 0 OR (position(snapshot) == 0 AND (Generator_status_initial == 0 OR Generator_p_init))
    description: a snapshot whose ramp reads a previous output — any snapshot but its period's first, and the horizon's first where the generator comes in off or carries an initial output
  Generator_maint_ext:
    where: Generator_maintainable AND Generator_p_nom_extendable AND NOT (Generator_committable AND Generator_p_nom_mod > 0) AND Generator_active
    description: a maintainable generator with an extendable build, unless it is committable and modular, that stands in the snapshot's period — the maintenance rows against the chosen build
  Link_committed:
    where: Link_committable AND Link_active
    description: a committable link that stands in the snapshot's period — every unit-commitment row's set
  Link_com_ext:
    where: Link_committable AND Link_p_nom_extendable AND NOT (Link_p_nom_mod > 0) AND Link_active
    description: a committable link with an extendable, non-modular build that stands in the snapshot's period — PyPSA's `com-ext` rows, whose status is relaxed against the chosen build
  Link_ramps_from_previous:
    where: position(snapshot, within=snapshot_period[period]) > 0 OR (position(snapshot) == 0 AND (Link_status_initial == 0 OR Link_p_init))
    description: a snapshot whose ramp reads a previous output — any snapshot but its period's first, and the horizon's first where the link comes in off or carries an initial output
  Link_maint_ext:
    where: Link_maintainable AND Link_p_nom_extendable AND NOT (Link_committable AND Link_p_nom_mod > 0) AND Link_active
    description: a maintainable link with an extendable build, unless it is committable and modular, that stands in the snapshot's period — the maintenance rows against the chosen build
  Process_committed:
    where: Process_committable AND Process_active
    description: a committable process that stands in the snapshot's period — every unit-commitment row's set
  Process_com_ext:
    where: Process_committable AND Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0) AND Process_active
    description: a committable process with an extendable, non-modular build that stands in the snapshot's period — PyPSA's `com-ext` rows, whose status is relaxed against the chosen build
  Process_ramps_from_previous:
    where: position(snapshot, within=snapshot_period[period]) > 0 OR (position(snapshot) == 0 AND (Process_status_initial == 0 OR Process_p_init))
    description: a snapshot whose ramp reads a previous output — any snapshot but its period's first, and the horizon's first where the process comes in off or carries an initial output
  Process_maint_ext:
    where: Process_maintainable AND Process_p_nom_extendable AND NOT (Process_committable AND Process_p_nom_mod > 0) AND Process_active
    description: a maintainable process with an extendable build, unless it is committable and modular, that stands in the snapshot's period — the maintenance rows against the chosen build
  StorageUnit_fix:
    where: NOT StorageUnit_p_nom_extendable AND StorageUnit_active
    description: a storage unit with a fixed build that stands in the snapshot's period — PyPSA's `fix` rows
  StorageUnit_ext:
    where: StorageUnit_p_nom_extendable AND StorageUnit_active
    description: a storage unit with an extendable build that stands in the snapshot's period — PyPSA's `ext` rows
  Line_lossy:
    where: transmission_losses AND Line_active
    description: a line that stands in the snapshot's period, where the run models transmission losses
  Transformer_lossy:
    where: transmission_losses AND Transformer_active
    description: a transformer that stands in the snapshot's period, where the run models transmission losses
variables:
  CVaR_a:
    dims: [scenario]
    where: CVaR_omega
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`CVaR-a` — how far a scenario''s operating cost exceeds the tail''s start; nothing where it does not'
  CVaR_theta:
    dims: []
    where: CVaR_omega
    domain: continuous
    missing: neutral
    description: '`CVaR-theta` — where the tail starts, the value at risk'
  CVaR:
    dims: []
    where: CVaR_omega
    domain: continuous
    missing: neutral
    description: '`CVaR` — the tail''s average cost, what the objective prices at `omega`'
  Generator_p:
    dims: [scenario, snapshot, generator]
    where: Generator_active
    domain: continuous
    missing: absent
    description: '`Generator-p` — output of a generator in a snapshot'
  Generator_n_mod:
    dims: [generator]
    where: Generator_p_nom_extendable AND Generator_p_nom_mod > 0 AND Generator_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Generator-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Generator_p_nom_ext:
    dims: [generator]
    where: Generator_p_nom_extendable AND Generator_active_asset
    domain: continuous
    missing: absent
    description: '`Generator-p_nom` — nominal power where it is a decision, for a generator that is active; the parameter of the same PyPSA name carries the fixed regime'
  Generator_status:
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Generator-status` — how much of a committable unit is on: an integer the rows below cap at one, or at the module count where the build is modular'
  Generator_start_up:
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Generator-start_up` — how much of a committable unit turns on this snapshot, capped as the status is'
  Generator_shut_down:
    dims: [scenario, snapshot, generator]
    where: Generator_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Generator-shut_down` — how much of a committable unit turns off this snapshot, capped as the status is'
  Generator_maintenance:
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    bounds: {lower: 0.0, upper: 1.0}
    domain: continuous
    missing: neutral
    description: '`Generator-maintenance` — whether a maintainable generator is in maintenance: continuous, and one exactly where an event covers the snapshot'
  Generator_maintenance_start:
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_active
    domain: binary
    missing: neutral
    description: '`Generator-maintenance_start` — whether a maintenance event starts in this snapshot'
  Generator_maintenance_capacity:
    dims: [scenario, snapshot, generator]
    where: Generator_maint_ext
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Generator-maintenance_capacity` — the chosen build while in maintenance, zero otherwise: the product the `maintcap` rows linearize'
  Generator_maintenance_status:
    dims: [scenario, snapshot, generator]
    where: Generator_maintainable AND Generator_committed AND NOT (Generator_p_nom_extendable AND NOT (Generator_p_nom_mod > 0))
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Generator-maintenance_status` — the status while in maintenance, zero otherwise: the product the `maint-status` rows linearize, so a unit in maintenance may also be off'
  Link_p:
    dims: [scenario, snapshot, link]
    where: Link_active
    domain: continuous
    missing: absent
    description: '`Link-p` — PyPSA''s `p0`, the flow measured at the `Link_bus0` end: a positive value withdraws there and injects at every bus the link''s output ports deliver to'
  Link_n_mod:
    dims: [link]
    where: Link_p_nom_extendable AND Link_p_nom_mod > 0 AND Link_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Link-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Link_p_nom_ext:
    dims: [link]
    where: Link_p_nom_extendable AND Link_active_asset
    domain: continuous
    missing: absent
    description: '`Link-p_nom` — nominal power where it is a decision, for a link that is active; the parameter of the same PyPSA name carries the fixed regime'
  Link_status:
    dims: [scenario, snapshot, link]
    where: Link_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Link-status` — how much of a committable link is on: an integer the rows below cap at one, or at the module count where the build is modular'
  Link_start_up:
    dims: [scenario, snapshot, link]
    where: Link_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Link-start_up` — how much of a committable link turns on this snapshot, capped as the status is'
  Link_shut_down:
    dims: [scenario, snapshot, link]
    where: Link_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Link-shut_down` — how much of a committable link turns off this snapshot, capped as the status is'
  Link_maintenance:
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    bounds: {lower: 0.0, upper: 1.0}
    domain: continuous
    missing: neutral
    description: '`Link-maintenance` — whether a maintainable link is in maintenance: continuous, and one exactly where an event covers the snapshot'
  Link_maintenance_start:
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_active
    domain: binary
    missing: neutral
    description: '`Link-maintenance_start` — whether a maintenance event starts in this snapshot'
  Link_maintenance_capacity:
    dims: [scenario, snapshot, link]
    where: Link_maint_ext
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Link-maintenance_capacity` — the chosen build while in maintenance, zero otherwise: the product the `maintcap` rows linearize'
  Link_maintenance_status:
    dims: [scenario, snapshot, link]
    where: Link_maintainable AND Link_committed AND NOT (Link_p_nom_extendable AND NOT (Link_p_nom_mod > 0))
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Link-maintenance_status` — the status while in maintenance, zero otherwise: the product the `maint-status` rows linearize, so a unit in maintenance may also be off'
  Process_p:
    dims: [scenario, snapshot, process]
    where: Process_active
    domain: continuous
    missing: absent
    description: '`Process-p` — PyPSA''s internal power `p`: a positive value drives every port at its own rate, withdrawing where the rate is negative and injecting where it is positive'
  Process_n_mod:
    dims: [process]
    where: Process_p_nom_extendable AND Process_p_nom_mod > 0 AND Process_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Process-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Process_p_nom_ext:
    dims: [process]
    where: Process_p_nom_extendable AND Process_active_asset
    domain: continuous
    missing: absent
    description: '`Process-p_nom` — nominal internal power where it is a decision, for a process that is active; the parameter of the same PyPSA name carries the fixed regime'
  Process_status:
    dims: [scenario, snapshot, process]
    where: Process_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Process-status` — how much of a committable process is on: an integer the rows below cap at one, or at the module count where the build is modular'
  Process_start_up:
    dims: [scenario, snapshot, process]
    where: Process_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Process-start_up` — how much of a committable process turns on this snapshot, capped as the status is'
  Process_shut_down:
    dims: [scenario, snapshot, process]
    where: Process_committed
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Process-shut_down` — how much of a committable process turns off this snapshot, capped as the status is'
  Process_maintenance:
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    bounds: {lower: 0.0, upper: 1.0}
    domain: continuous
    missing: neutral
    description: '`Process-maintenance` — whether a maintainable process is in maintenance: continuous, and one exactly where an event covers the snapshot'
  Process_maintenance_start:
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_active
    domain: binary
    missing: neutral
    description: '`Process-maintenance_start` — whether a maintenance event starts in this snapshot'
  Process_maintenance_capacity:
    dims: [scenario, snapshot, process]
    where: Process_maint_ext
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Process-maintenance_capacity` — the chosen build while in maintenance, zero otherwise: the product the `maintcap` rows linearize'
  Process_maintenance_status:
    dims: [scenario, snapshot, process]
    where: Process_maintainable AND Process_committed AND NOT (Process_p_nom_extendable AND NOT (Process_p_nom_mod > 0))
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Process-maintenance_status` — the status while in maintenance, zero otherwise: the product the `maint-status` rows linearize, so a unit in maintenance may also be off'
  StorageUnit_p_dispatch:
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
    domain: continuous
    missing: absent
    description: '`StorageUnit-p_dispatch` — power delivered to the bus'
  StorageUnit_p_store:
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
    domain: continuous
    missing: absent
    description: '`StorageUnit-p_store` — power drawn from the bus into charge'
  StorageUnit_state_of_charge:
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_active
    domain: continuous
    missing: absent
    description: '`StorageUnit-state_of_charge` — energy held at the end of a snapshot'
  StorageUnit_spill:
    dims: [scenario, snapshot, storage_unit]
    where: StorageUnit_inflow > 0 AND StorageUnit_active
    bounds: {lower: 0.0, upper: StorageUnit_inflow}
    domain: continuous
    missing: neutral
    description: >-
      `StorageUnit-spill` — inflow passed on unused.
      Zero where there is no inflow, so the balance keeps its row there; the bounds are PyPSA's, on the variable rather than as rows
  StorageUnit_p_nom_ext:
    dims: [storage_unit]
    where: StorageUnit_p_nom_extendable AND StorageUnit_active_asset
    domain: continuous
    missing: absent
    description: '`StorageUnit-p_nom` — nominal power where it is a decision, for a storage unit that is active; the parameter of the same PyPSA name carries the fixed regime'
  StorageUnit_n_mod:
    dims: [storage_unit]
    where: StorageUnit_p_nom_extendable AND StorageUnit_p_nom_mod > 0 AND StorageUnit_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`StorageUnit-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Store_e:
    dims: [scenario, snapshot, store]
    where: Store_active
    domain: continuous
    missing: absent
    description: '`Store-e` — energy held at the end of a snapshot'
  Store_p:
    dims: [scenario, snapshot, store]
    where: Store_active
    domain: continuous
    missing: absent
    description: '`Store-p` — power delivered to the bus; charging is negative'
  Store_e_nom_ext:
    dims: [store]
    where: Store_e_nom_extendable AND Store_active_asset
    domain: continuous
    missing: absent
    description: '`Store-e_nom` — nominal capacity where it is a decision, for a store that is active; the parameter of the same PyPSA name carries the fixed regime'
  Store_n_mod:
    dims: [store]
    where: Store_e_nom_extendable AND Store_e_nom_mod > 0 AND Store_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Store-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Line_s:
    dims: [scenario, snapshot, line]
    where: Line_active
    domain: continuous
    missing: absent
    description: '`Line-s` — PyPSA''s `p0`, the flow measured at the `Line_bus0` end: a positive value withdraws there and injects at `Line_bus1`, lossless'
  Line_loss:
    dims: [scenario, snapshot, line]
    where: Line_lossy
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Line-loss` — what a line dissipates carrying its flow, pushed down by the cost and held up by the cuts; absent, and zero in the balance, where the network is lossless'
  Line_s_nom_ext:
    dims: [line]
    where: Line_s_nom_extendable AND Line_active_asset
    domain: continuous
    missing: absent
    description: '`Line-s_nom` — nominal apparent power where it is a decision, for a line that is active; the parameter of the same PyPSA name carries the fixed regime'
  Line_n_mod:
    dims: [line]
    where: Line_s_nom_extendable AND Line_s_nom_mod > 0 AND Line_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Line-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
  Transformer_s:
    dims: [scenario, snapshot, transformer]
    where: Transformer_active
    domain: continuous
    missing: absent
    description: '`Transformer-s` — PyPSA''s `p0`, the flow measured at the `Transformer_bus0` end: a positive value withdraws there and injects at `Transformer_bus1`, lossless'
  Transformer_loss:
    dims: [scenario, snapshot, transformer]
    where: Transformer_lossy
    bounds: {lower: 0.0}
    domain: continuous
    missing: neutral
    description: '`Transformer-loss` — what a transformer dissipates carrying its flow, as a line does; absent, and zero in the balance, where the network is lossless'
  Transformer_phase_shift:
    dims: [scenario, snapshot, transformer]
    where: Transformer_phase_shift_varying AND Transformer_active
    bounds: {lower: Transformer_phase_shift_min, upper: Transformer_phase_shift_max}
    domain: continuous
    missing: neutral
    description: '`Transformer-phase_shift` — a phase-shifting transformer''s voltage angle shift in degrees, chosen per snapshot to redistribute the flows around its cycles without moving active power; absent, and zero in the cycle sum, where the shift is fixed'
  Transformer_s_nom_ext:
    dims: [transformer]
    where: Transformer_s_nom_extendable AND Transformer_active_asset
    domain: continuous
    missing: absent
    description: '`Transformer-s_nom` — nominal apparent power where it is a decision, for a transformer that is active; the parameter of the same PyPSA name carries the fixed regime'
  Transformer_n_mod:
    dims: [transformer]
    where: Transformer_s_nom_extendable AND Transformer_s_nom_mod > 0 AND Transformer_active_asset
    bounds: {lower: 0.0}
    domain: integer
    missing: absent
    description: '`Transformer-n_mod` — how many modules of an extendable modular build; none for a unit that is not active'
expressions:
  GlobalConstraint_energy_weight:
    dims: [scenario, global_constraint, snapshot]
    description: what one unit of power at a snapshot counts for in a row — the generator weighting times the years of the snapshot's period, where the row counts the snapshot, and nothing where it does not
    cases:
      counted:
        when: GlobalConstraint_counts_snapshot
        expression: snapshot_weightings_generators * at(period_weight_years, by=snapshot_period[period])
    otherwise: '0'
  risk_weighted_opex: (1 - CVaR_omega) * sum(scenario_weight * scenario_opex, over=scenario) + CVaR_omega * CVaR
  Carrier_relative_growth:
    dims: [carrier]
    description: the share of the previous period's additions a carrier's growth limit reads — PyPSA's `max_relative_growth` clipped at zero, so a negative share adds nothing and never tightens the limit
    cases:
      positive:
        when: Carrier_max_relative_growth > 0
        expression: Carrier_max_relative_growth
    otherwise: '0'
  Outage_s:
    dims: [scenario, snapshot, outage]
    description: the flow an outage takes off its branch — the outaged line's or transformer's flow before it goes out
    cases:
      line:
        when: Outage_line
        expression: at(Line_s_monitored, by=Outage_line[line])
    otherwise: at(Transformer_s_monitored, by=Outage_transformer[transformer])
  Generator_p_nom_available:
    dims: [scenario, snapshot, generator]
    expression: Generator_p_nom_effective + Generator_maintenance_outage
    description: the build a unit's output limits are taken against in a snapshot — the effective build, less what maintenance takes out of it, where a maintenance file adds that
  Generator_p_nom_effective:
    dims: [scenario, generator]
    description: the build a generator's limits are taken against — the chosen one where it is extendable, the given one otherwise
    cases:
      extendable: {when: Generator_p_nom_extendable, expression: Generator_p_nom_ext}
    otherwise: Generator_p_nom
  Generator_p_nom_committed:
    dims: [scenario, generator]
    description: the build a committed unit's ramp rows are taken against — one module where the build is extendable and modular, the given build otherwise
    cases:
      modular_build:
        when: Generator_p_nom_extendable AND Generator_p_nom_mod > 0
        expression: Generator_p_nom_mod
    otherwise: Generator_p_nom
  Generator_primary_energy: sum(sum((Generator_p * GlobalConstraint_energy_weight) * Generator_primary_energy_weight, over=snapshot), over=generator)
  Generator_operational_limit: sum(sum((Generator_p * GlobalConstraint_energy_weight) * Generator_operational_limit_weight, over=snapshot), over=generator)
  Generator_tech_capacity_expansion: sum(Generator_p_nom_ext * Generator_tech_capacity_weight, over=generator)
  Generator_opex: sum(sum(((Generator_p * Generator_marginal_cost) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=generator), over=snapshot) + sum(sum((((Generator_p * Generator_p) * Generator_marginal_cost_quadratic) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=generator), over=snapshot)
  Generator_capex: sum(scenario_weight * Generator_p_nom_ext * Generator_capital_cost * Generator_capital_weight)
  Generator_additions: sum(Generator_p_nom_ext * Generator_first_active, over=generator, by=Generator_carrier[carrier])
  Generator_injection: sum(Generator_sign * Generator_p, over=generator, by=Generator_bus[bus])
  Generator_status_available:
    dims: [scenario, snapshot, generator]
    expression: Generator_status + Generator_maintenance_status_outage
    description: how much of a committed unit is on and can run — its status, less what maintenance takes out of it, where a maintenance file adds that
  Generator_previous_status:
    dims: [scenario, snapshot, generator]
    description: the commitment state a generator carries into a snapshot — off at the first snapshot it stands in past the first of the horizon, as PyPSA reads a status it did not build (`constraints.py:298`), and the state carried over otherwise
    cases:
      opening_late:
        when: position(snapshot) > 0 AND NOT shift(Generator_active, along=snapshot, offset=1)
        expression: '0'
    otherwise: Generator_status_carried_over
  Generator_status_carried_over:
    dims: [scenario, snapshot, generator]
    description: the state a generator carries over into a snapshot — the state it brought into the horizon at the first, the previous snapshot's after that
    cases:
      opening:
        when: position(snapshot) == 0
        expression: Generator_status_initial
    otherwise: shift(Generator_status, along=snapshot, offset=1)
  Generator_commitment_opex: sum(sum(((Generator_status * Generator_stand_by_cost) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=generator), over=snapshot) + sum(sum(Generator_start_up * Generator_start_up_cost, over=generator), over=snapshot) + sum(sum(Generator_shut_down * Generator_shut_down_cost, over=generator), over=snapshot)
  Generator_previous_p:
    dims: [scenario, snapshot, generator]
    description: the output a generator carries into a snapshot — at the first, the `p_init` it brought in where it came in running and nothing where it came in off; the previous snapshot's after that
    cases:
      opening:
        when: position(snapshot) == 0
        expression: Generator_status_initial * Generator_p_init
    otherwise: shift(Generator_p, along=snapshot, offset=1)
  Generator_ramp_up_rate:
    dims: [scenario, snapshot, generator]
    description: the ramp limit a unit's up row reads — PyPSA's `ramp_limit_up`, or the full build where it has none, since a start-up ramp alone builds the row
    cases:
      given: {when: Generator_ramp_limit_up, expression: Generator_ramp_limit_up}
    otherwise: '1'
  Generator_ramp_down_rate:
    dims: [scenario, snapshot, generator]
    description: the ramp limit a unit's down row reads — PyPSA's `ramp_limit_down`, or the full build where it has none, since a shut-down ramp alone builds the row
    cases:
      given: {when: Generator_ramp_limit_down, expression: Generator_ramp_limit_down}
    otherwise: '1'
  Generator_start_up_rate:
    dims: [scenario, generator]
    description: the start-up ramp a unit's up row reads — PyPSA's `ramp_limit_start_up`, or the full build where it has none
    cases:
      given: {when: Generator_ramp_limit_start_up, expression: Generator_ramp_limit_start_up}
    otherwise: '1'
  Generator_shut_down_rate:
    dims: [scenario, generator]
    description: the shut-down ramp a unit's down row reads — PyPSA's `ramp_limit_shut_down`, or the full build where it has none
    cases:
      given: {when: Generator_ramp_limit_shut_down, expression: Generator_ramp_limit_shut_down}
    otherwise: '1'
  Generator_ramp_up_allowance:
    dims: [scenario, snapshot, generator]
    description: how far a generator may raise output between two snapshots — its ramp limit of the build while it stays on, plus its start-up ramp in the snapshot it turns on
    cases:
      committed:
        when: Generator_committable
        expression: Generator_ramp_up_rate * Generator_p_nom_committed * Generator_previous_status + Generator_start_up_rate * Generator_p_nom_committed * (Generator_status - Generator_previous_status)
    otherwise: Generator_ramp_up_rate * Generator_p_nom_effective
  Generator_ramp_down_allowance:
    dims: [scenario, snapshot, generator]
    description: how far a generator may lower output between two snapshots — its ramp limit of the build while it stays on, plus its shut-down ramp in the snapshot it turns off
    cases:
      committed:
        when: Generator_committable
        expression: Generator_ramp_down_rate * Generator_p_nom_committed * Generator_status + Generator_shut_down_rate * Generator_p_nom_committed * (Generator_previous_status - Generator_status)
    otherwise: Generator_ramp_down_rate * Generator_p_nom_effective
  Generator_maintenance_outage:
    dims: [scenario, snapshot, generator]
    description: the build maintenance takes out of a unit — the chosen share where the build is extendable, the given build while it is under maintenance otherwise
    cases:
      extendable:
        when: Generator_p_nom_extendable
        expression: -Generator_maintenance_pu * Generator_maintenance_capacity
    otherwise: -Generator_maintenance_pu * Generator_p_nom * Generator_maintenance
  Generator_maintenance_status_outage: -Generator_maintenance_pu * Generator_maintenance_status
  Link_p_nom_available:
    dims: [scenario, snapshot, link]
    expression: Link_p_nom_effective + Link_maintenance_outage
    description: the build a unit's output limits are taken against in a snapshot — the effective build, less what maintenance takes out of it, where a maintenance file adds that
  Link_p_nom_effective:
    dims: [scenario, link]
    description: the build a link's limits are taken against — the chosen one where it is extendable, the given one otherwise
    cases:
      extendable: {when: Link_p_nom_extendable, expression: Link_p_nom_ext}
    otherwise: Link_p_nom
  Link_p_nom_committed:
    dims: [scenario, link]
    description: the build a committed link's ramp rows are taken against — one module where the build is extendable and modular, the given build otherwise
    cases:
      modular_build:
        when: Link_p_nom_extendable AND Link_p_nom_mod > 0
        expression: Link_p_nom_mod
    otherwise: Link_p_nom
  Link_output_arrival:
    dims: [scenario, snapshot, link_output]
    description: >-
      what a link delivers to an output port at a snapshot — its flow delayed by the port's `delay` within its investment period, times the port's efficiency at the snapshot the flow arrives; where the port is `cyclic_delay` the delayed flow wraps from the period's end, and where it is not the flow still in transit at the period's first snapshots is lost.
      A port that does not delay (`delay` zero) delivers its flow unshifted, cyclic or not
    cases:
      wrapping:
        when: Link_output_cyclic_delay
        expression: shift(at(Link_p, by=Link_output_link[link]), along=snapshot, offset=Link_output_delay, edge='wrap', within=snapshot_period[period]) * Link_efficiency
    otherwise: shift(at(Link_p, by=Link_output_link[link]), along=snapshot, offset=Link_output_delay, edge=0, within=snapshot_period[period]) * Link_efficiency
  Link_transmission_volume_expansion: sum(Link_p_nom_ext * Link_volume_weight, over=link)
  Link_transmission_expansion_cost: sum(Link_p_nom_ext * Link_expansion_cost_weight, over=link)
  Link_tech_capacity_expansion: sum(Link_p_nom_ext * Link_tech_capacity_weight, over=link)
  Link_opex: sum(sum(((Link_p * Link_marginal_cost) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=link), over=snapshot) + sum(sum((((Link_p * Link_p) * Link_marginal_cost_quadratic) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=link), over=snapshot)
  Link_capex: sum(scenario_weight * Link_p_nom_ext * Link_capital_cost * Link_capital_weight)
  Link_additions: sum(Link_p_nom_ext * Link_first_active, over=link, by=Link_carrier[carrier])
  Link_injection: -sum(Link_p, over=link, by=Link_bus0[bus]) + sum(Link_output_arrival, over=link_output, by=Link_output_bus[bus])
  Link_status_available:
    dims: [scenario, snapshot, link]
    expression: Link_status + Link_maintenance_status_outage
    description: how much of a committed unit is on and can run — its status, less what maintenance takes out of it, where a maintenance file adds that
  Link_previous_status:
    dims: [scenario, snapshot, link]
    description: the commitment state a link carries into a snapshot — off at the first snapshot it stands in past the first of the horizon, as PyPSA reads a status it did not build (`constraints.py:298`), and the state carried over otherwise
    cases:
      opening_late:
        when: position(snapshot) > 0 AND NOT shift(Link_active, along=snapshot, offset=1)
        expression: '0'
    otherwise: Link_status_carried_over
  Link_status_carried_over:
    dims: [scenario, snapshot, link]
    description: the state a link carries over into a snapshot — the state it brought into the horizon at the first, the previous snapshot's after that
    cases:
      opening:
        when: position(snapshot) == 0
        expression: Link_status_initial
    otherwise: shift(Link_status, along=snapshot, offset=1)
  Link_commitment_opex: sum(sum(((Link_status * Link_stand_by_cost) * snapshot_weightings_objective) * at(period_weight_objective, by=snapshot_period[period]), over=link), over=snapshot) + sum(sum(Link_start_up * Link_start_up_cost, over=link), over=snapshot) + sum(sum(Link_shut_down * Link_shut_down_cost, over=link), over=snapshot)
  Link_previous_p:
    dims: [scenario, snapshot, link]
    description: the flow a link carries into a snapshot — at the first, the `p_init` it brought in where it came in running and nothing where it came in off; the previous snapshot's after that
    cases:
      opening:
        when: position(snapshot) == 0
        expression: Link_status_initial * Link_p_init
    otherwise: shift(Link_p, along=snapshot, offset=1)
  Link_ramp_up_rate:
    dims: [scenario, snapshot, link]
    description: the ramp limit a link's up row reads — PyPSA's `ramp_limit_up`, or the full build where it has none, since a start-up ramp alone builds the row
    cases:
      given: {when: Link_ramp_limit_up, expression: Link_ramp_limit_up}
    otherwise: '1'
  Link_ramp_down_rate:
    dims: [scenario, snapshot, link]
    description: the ramp limit a link's down row reads — PyPSA's `ramp_limit_down`, or the full build where it has none, since a shut-down ramp alone builds the row
    cases:
      given: {when: Link_ramp_limit_down, expression: Link_ramp_limit_down}
    otherwise: '1'
  Link_start_up_rate:
    dims: [scenario, link]
    description: the start-up ramp a link's up row reads — PyPSA's `ramp_limit_start_up`, or the full build where it has none
    cases:
      given: {when: Link_ramp_limit_start_up, expression: Link_ramp_limit_start_up}
    otherwise: '1'
  Link_shut_down_rate:
    dims: [scenario, link]
    description: the shut-down ramp a link's down row reads — PyPSA's `ramp_limit_shut_down`, or the full build where it has none
    cases:
      given: {when: Link_ramp_limit_shut_down, expression: Link_ramp_limit_shut_down}
    otherwise: '1'
  Link_ramp_up_allowance:
    dims: [scenario, snapshot, link]
    description: how far a link may raise flow between two snapshots — its ramp limit of the build while it stays on, plus its start-up ramp in the snapshot it turns on
    cases:
      committed:
        when: Link_committable
        expression: Link_ramp_up_rate * Link_p_nom_committed * Link_previous_status + Link_start_up_rate * Link_p_nom_committed * (Link_status - Link_previous_status)
    otherwise: Link_ramp_up_rate * Link_p_nom_effective
  Link_ramp_down_allowance:
    dims: [scenario, snapshot, link]
