description: >-
  A window inside a group: the window stops at the first hour of each day.

dimensions:
  unit: { dtype: str }
  hour: { dtype: int, ordered: true }
  day: { dtype: str }

relations:
  day_of: { key: hour, values: day }

variables:
  started:
    dims: [unit, hour]
    domain: binary
  on:
    dims: [unit, hour]
    domain: binary

constraints:
  stays_up_inside_its_day:
    dims: [unit, hour]
    expression: sum_back(started, along=hour, window=3, within=day_of[day]) <= on

objective: { sense: minimize, expression: sum(on) }
