description: >-
  A shift inside a group: each season wraps on itself. A season's first
  snapshot takes the value of that season's last, and no value crosses from one
  season into the next.

dimensions:
  snapshot: { dtype: int, ordered: true }
  season: { dtype: str }

relations:
  season_of: { key: snapshot, values: season }

variables:
  p:
    dims: [snapshot]
    bounds: { lower: 0 }

constraints:
  no_faster_than_before_in_season:
    dims: [snapshot]
    expression: p <= shift(p, along=snapshot, offset=1, edge='wrap', within=season_of[season])

objective: { sense: minimize, expression: sum(p) }
