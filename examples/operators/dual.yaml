description: >-
  After the solver runs, `dual(constraint)` has the constraint's dimensions,
  and each value is the marginal value of the constraint at that
  coordinate (its shadow price).

dimensions:
  snapshot: { dtype: int }

parameters:
  load: { dims: [snapshot] }

variables:
  p:
    dims: [snapshot]
    bounds: { lower: 0 }

constraints:
  balance:
    dims: [snapshot]
    expression: p >= load

expressions:
  price: dual(balance)

objective: { sense: minimize, expression: sum(p) }
