# How `examples/times/trade.yaml` prints: TIMES' own letters for its indices. An alias prints primed.
notation: latex
dimensions:
  region: { index: r, set: '\mathcal{R}' }
  commodity: { index: c, set: '\mathcal{C}' }
  process: { index: p, set: '\mathcal{P}' }
