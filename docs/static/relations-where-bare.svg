<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 156" width="760" height="156" style="max-width: 100%; height: auto" role="img" aria-labelledby="rwb-t rwb-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="rwb-t">A bare relation in a where condition keeps the pairs it lists</title>
  <desc id="rwb-d">The bare relation connection is a table with three rows: wind and north, gas and north, and gas and south. The variable flow, declared with where connection, is a table with the same three pairs of generator and bus. The pair wind and south, which connection does not list, has no row, so flow is absent there.</desc>
  <defs>
    <marker id="rwb-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g transform="translate(0,-98)">
  <g stroke="none">
    <path d="M16,154 H176 V211 A3,3 0 0 1 173,214 H19 A3,3 0 0 1 16,211 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,154 V135 A3,3 0 0 1 19,132 H173 A3,3 0 0 1 176,135 V154 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M324,154 H574 V211 A3,3 0 0 1 571,214 H327 A3,3 0 0 1 324,211 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M324,154 V135 A3,3 0 0 1 327,132 H571 A3,3 0 0 1 574,135 V154 Z" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="122" font-weight="bold">connection</text>
    <text x="94" y="122" fill-opacity="0.7">a relation</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="146" font-weight="bold">generator</text>
      <text x="110" y="146" font-weight="bold">bus</text>
      <text x="24" y="170">wind</text><text x="110" y="170">north</text>
      <text x="24" y="188">gas</text><text x="110" y="188">north</text>
      <text x="24" y="206">gas</text><text x="110" y="206">south</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="132" width="160" height="82" rx="3"/>
    <line x1="16" y1="154" x2="176" y2="154"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#rwb-arrow)">
    <path d="M186,176 L312,176"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="198" y="164">where: connection</text>
    <text x="198" y="194" fill-opacity="0.7">keeps the pairs</text>
    <text x="198" y="209" fill-opacity="0.7">the relation lists</text>
  </g>
  <g fill="currentColor">
    <text x="324" y="122" font-weight="bold">flow</text>
    <text x="360" y="122" fill-opacity="0.7">a variable</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="332" y="146" font-weight="bold">generator</text>
      <text x="418" y="146" font-weight="bold">bus</text>
      <text x="332" y="170">wind</text><text x="418" y="170">north</text>
      <text x="332" y="188">gas</text><text x="418" y="188">north</text>
      <text x="332" y="206">gas</text><text x="418" y="206">south</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="324" y="132" width="250" height="82" rx="3"/>
    <line x1="324" y1="154" x2="574" y2="154"/>
    <rect x="324" y="218" width="250" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="332" y="234" fill-opacity="0.7" font-style="italic">no row for (wind, south): flow is absent</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="600" y="138" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="620" y="149">absent: no row</text>
  </g>
  </g>
</svg>
