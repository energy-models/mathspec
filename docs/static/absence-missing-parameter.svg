<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 334" width="760" height="334" style="max-width: 100%; height: auto" role="img" aria-labelledby="amp-t amp-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="amp-t">The four meanings of a missing parameter row</title>
  <desc id="amp-d">The parameter rel_max has a row for wind at 0.9 and a row for gas at 0.6, and no row for old. Under missing refused, the data is refused when it is attached. Under missing absent, rel_max has no row for old. Under missing neutral, old takes 0 as a coefficient and false in a condition. Under missing 1, old takes the value 1.</desc>
  <defs>
    <marker id="amp-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M300,60 H472 V99 A3,3 0 0 1 469,102 H303 A3,3 0 0 1 300,99 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M300,60 V41 A3,3 0 0 1 303,38 H469 A3,3 0 0 1 472,41 V60 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M202,248 H374 V287 A3,3 0 0 1 371,290 H205 A3,3 0 0 1 202,287 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M202,248 V229 A3,3 0 0 1 205,226 H371 A3,3 0 0 1 374,229 V248 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M388,248 H560 V305 A3,3 0 0 1 557,308 H391 A3,3 0 0 1 388,305 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M388,248 V229 A3,3 0 0 1 391,226 H557 A3,3 0 0 1 560,229 V248 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M574,248 H746 V305 A3,3 0 0 1 743,308 H577 A3,3 0 0 1 574,305 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M574,248 V229 A3,3 0 0 1 577,226 H743 A3,3 0 0 1 746,229 V248 Z" fill="#0072B2" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="16" y="28">parameters:</text>
      <text x="31" y="46">rel_max:</text>
      <text x="46" y="64">dims: [generator]</text>
      <text x="46" y="82" font-weight="bold">missing: ...</text>
    </g>
    <text x="300" y="28" font-weight="bold">rel_max</text>
    <text x="358" y="28" fill-opacity="0.7">a parameter</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="308" y="52" font-weight="bold">generator</text>
      <text x="394" y="52" font-weight="bold">value</text>
      <text x="308" y="76">wind</text><text x="394" y="76">0.9</text>
      <text x="308" y="94">gas</text><text x="394" y="94">0.6</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="300" y="38" width="172" height="64" rx="3"/>
    <line x1="300" y1="60" x2="472" y2="60"/>
    <rect x="300" y="106" width="172" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="308" y="122" fill-opacity="0.7" font-style="italic">no row for old</text>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#amp-arrow)">
    <path d="M386,136 V158 H102 V182"/>
    <path d="M386,136 V158 H288 V182"/>
    <path d="M386,136 V158 H474 V182"/>
    <path d="M386,136 V158 H660 V182"/>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" font-weight="bold">
    <text x="16" y="200">missing: refused</text>
    <text x="202" y="200">missing: absent</text>
    <text x="388" y="200">missing: neutral</text>
    <text x="574" y="200">missing: 1</text>
  </g>
  <g fill="currentColor" font-size="12" fill-opacity="0.7">
    <text x="16" y="216">rel_max, a parameter</text>
    <text x="202" y="216">rel_max, a parameter</text>
    <text x="388" y="216">rel_max, a parameter</text>
    <text x="574" y="216">rel_max, a parameter</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" transform="translate(0 16)">
    <rect x="16" y="210" width="172" height="82" rx="3"/>
    <rect x="202" y="210" width="172" height="64" rx="3"/>
    <line x1="202" y1="232" x2="374" y2="232"/>
    <rect x="202" y="278" width="172" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
    <rect x="388" y="210" width="172" height="82" rx="3"/>
    <line x1="388" y1="232" x2="560" y2="232"/>
    <rect x="574" y="210" width="172" height="82" rx="3"/>
    <line x1="574" y1="232" x2="746" y2="232"/>
  </g>
  <g fill="currentColor" font-size="12" transform="translate(0 16)">
    <text x="102" y="246" text-anchor="middle" font-style="italic" fill-opacity="0.7">refused when the</text>
    <text x="102" y="262" text-anchor="middle" font-style="italic" fill-opacity="0.7">data is attached</text>
    <text x="210" y="294" fill-opacity="0.7" font-style="italic">no row for old</text>
  </g>
  <g fill="currentColor" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" transform="translate(0 16)">
    <text x="210" y="224" font-weight="bold">generator</text><text x="296" y="224" font-weight="bold">value</text>
    <text x="210" y="248">wind</text><text x="296" y="248">0.9</text>
    <text x="210" y="266">gas</text><text x="296" y="266">0.6</text>
    <text x="396" y="224" font-weight="bold">generator</text><text x="482" y="224" font-weight="bold">value</text>
    <text x="396" y="248">wind</text><text x="482" y="248">0.9</text>
    <text x="396" y="266">gas</text><text x="482" y="266">0.6</text>
    <text x="396" y="284">old</text><text x="482" y="284" font-weight="bold">0 / false</text>
    <text x="582" y="224" font-weight="bold">generator</text><text x="668" y="224" font-weight="bold">value</text>
    <text x="582" y="248">wind</text><text x="668" y="248">0.9</text>
    <text x="582" y="266">gas</text><text x="668" y="266">0.6</text>
    <text x="582" y="284">old</text><text x="668" y="284" font-weight="bold">1</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="600" y="38" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="620" y="49">absent: no row</text>
  </g>
</svg>
