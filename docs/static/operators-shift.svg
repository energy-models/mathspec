<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 639 130" width="639" height="130" style="max-width: 100%; height: auto" role="img" aria-labelledby="osh-t osh-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="osh-t">A wrapped shift gives the first snapshot the value of the last</title>
  <desc id="osh-d">The variable soc has three rows for the storage battery, at snapshots 0, 1 and 2. shift of soc along snapshot, with offset 1 and edge wrap, has the same three rows. At snapshot 0 it is soc at 2, at snapshot 1 it is soc at 0, and at snapshot 2 it is soc at 1.</desc>
  <defs>
    <pattern id="osh-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D55E00" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
    <marker id="osh-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,56 H169.5 V115 A3,3 0 0 1 166.5,118 H19 A3,3 0 0 1 16,115 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,56 V37 A3,3 0 0 1 19,34 H166.5 A3,3 0 0 1 169.5,37 V56 Z" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="24" font-weight="bold">soc</text>
    <text x="49" y="24" fill-opacity="0.7">a variable</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="48" font-weight="bold">snapshot</text>
      <text x="104" y="48" font-weight="bold">storage</text>
      <text x="24" y="72">0</text><text x="104" y="72">battery</text>
      <text x="24" y="90">1</text><text x="104" y="90">battery</text>
      <text x="24" y="108">2</text><text x="104" y="108">battery</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="34" width="154" height="84" rx="3"/>
    <line x1="16" y1="56" x2="170" y2="56"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#osh-arrow)">
    <path d="M179.5,87.0 L332.5,87.0"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="192" y="81">edge=&#x27;wrap&#x27;</text>
    <text x="192" y="103" fill-opacity="0.7">offset=1, counted</text>
    <text x="192" y="118" fill-opacity="0.7">cyclically</text>
  </g>
  <g stroke="none">
    <path d="M344.5,56 H629.5 V115 A3,3 0 0 1 626.5,118 H347.5 A3,3 0 0 1 344.5,115 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M344.5,56 V37 A3,3 0 0 1 347.5,34 H626.5 A3,3 0 0 1 629.5,37 V56 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="344.5" y="24" font-weight="bold">shift(soc, …)</text>
    <text x="453" y="24" fill-opacity="0.7">an operator result</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="352" y="48" font-weight="bold">snapshot</text>
      <text x="433" y="48" font-weight="bold">storage</text>
      <text x="506" y="48" font-weight="bold">value</text>
      <text x="352" y="72">0</text><text x="433" y="72">battery</text><text x="506" y="72">soc[2, battery]</text>
      <text x="352" y="90">1</text><text x="433" y="90">battery</text><text x="506" y="90">soc[0, battery]</text>
      <text x="352" y="108">2</text><text x="433" y="108">battery</text><text x="506" y="108">soc[1, battery]</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="344.5" y="34" width="285" height="84" rx="3"/>
    <line x1="344.5" y1="56" x2="630" y2="56"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
  </g>
  <g fill="currentColor" font-size="12">
  </g>
</svg>
