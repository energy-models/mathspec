<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="820" height="440" style="max-width: 100%; height: auto" role="img" aria-labelledby="lme-t lme-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="lme-t">An empty group is a row with no variable, and a key tuple outside the domain has no row</title>
  <desc id="lme-d">The relation gen_zone, keyed by generator and snapshot with missing: absent, puts wind in zone north at snapshots 0 and 1, and gas in zone north at snapshot 0. It has no row for gas at snapshot 1, so f has no value there. The constraint zonal sums p by zone and has one row per snapshot and zone. At snapshot 0, north is p of wind plus p of gas, at most 5. At snapshot 1, north is p of wind, at most 6. South has no generator at either snapshot, so its rows are 0 at most 2 and 0 at most 3: empty groups with no variable. The lookup at of zone_cap by gen_zone has one row per row of gen_zone: wind at 0 takes 5, gas at 0 takes 5, wind at 1 takes 6. It has no row for gas at snapshot 1, where at is absent.</desc>
  <defs>
    <marker id="lme-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,142 H236 V229 A3,3 0 0 1 233,232 H19 A3,3 0 0 1 16,229 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,142 V123 A3,3 0 0 1 19,120 H233 A3,3 0 0 1 236,123 V142 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M380,142 H800 V219 A3,3 0 0 1 797,222 H383 A3,3 0 0 1 380,219 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M380,142 V123 A3,3 0 0 1 383,120 H797 A3,3 0 0 1 800,123 V142 Z" fill="#009E73" fill-opacity="0.2"/>
    <path d="M380,292 H800 V379 A3,3 0 0 1 797,382 H383 A3,3 0 0 1 380,379 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M380,292 V273 A3,3 0 0 1 383,270 H797 A3,3 0 0 1 800,273 V292 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="16" y="28">relations:</text>
      <text x="31" y="46">gen_zone: { key: [generator, snapshot], values: zone, <tspan font-weight="bold">missing: absent</tspan> }</text>
      <text x="16" y="70">sum(p, over=generator, by=gen_zone[zone]) &lt;= zone_cap</text>
      <text x="16" y="88">at(zone_cap, by=gen_zone[zone])</text>
    </g>
    <text x="16" y="110" font-weight="bold">gen_zone</text>
    <text x="84" y="110" fill-opacity="0.7">a relation</text>
    <text x="380" y="110" font-weight="bold">zonal</text>
    <text x="424" y="110" fill-opacity="0.7">a constraint</text>
    <text x="380" y="260" font-weight="bold">at(zone_cap, by=gen_zone[zone])</text>
    <text x="604" y="260" fill-opacity="0.7">an expression</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="136" font-weight="bold">generator</text>
      <text x="104" y="136" font-weight="bold">snapshot</text>
      <text x="176" y="136" font-weight="bold">zone</text>
      <text x="24" y="160">wind</text><text x="104" y="160">0</text><text x="176" y="160">north</text>
      <text x="24" y="178">gas</text><text x="104" y="178">0</text><text x="176" y="178">north</text>
      <text x="24" y="196">wind</text><text x="104" y="196">1</text><text x="176" y="196">north</text>
      <text x="388" y="136" font-weight="bold">snapshot</text>
      <text x="460" y="136" font-weight="bold">zone</text>
      <text x="520" y="136" font-weight="bold">row</text>
      <text x="388" y="160">0</text><text x="460" y="160">north</text><text x="520" y="160">p[wind] + p[gas] ≤ 5</text>
      <text x="388" y="178">0</text><text x="460" y="178">south</text><text x="520" y="178">0 ≤ 2</text>
      <text x="388" y="196">1</text><text x="460" y="196">north</text><text x="520" y="196">p[wind] ≤ 6</text>
      <text x="388" y="214">1</text><text x="460" y="214">south</text><text x="520" y="214">0 ≤ 3</text>
      <text x="388" y="286" font-weight="bold">snapshot</text>
      <text x="470" y="286" font-weight="bold">generator</text>
      <text x="560" y="286" font-weight="bold">value</text>
      <text x="388" y="310">0</text><text x="470" y="310">wind</text><text x="560" y="310">5</text>
      <text x="388" y="328">0</text><text x="470" y="328">gas</text><text x="560" y="328">5</text>
      <text x="388" y="346">1</text><text x="470" y="346">wind</text><text x="560" y="346">6</text>
    </g>
    <g font-style="italic" font-size="11.5">
      <text x="580" y="178">empty group: no variable</text>
      <text x="580" y="214">empty group: no variable</text>
      <text x="30" y="219">no row for gas at 1: f has no value</text>
      <text x="394" y="369">no row for gas at 1: at is absent</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="120" width="220" height="112" rx="3"/>
    <line x1="16" y1="142" x2="236" y2="142"/>
    <rect x="380" y="120" width="420" height="102" rx="3"/>
    <line x1="380" y1="142" x2="800" y2="142"/>
    <rect x="380" y="270" width="420" height="112" rx="3"/>
    <line x1="380" y1="292" x2="800" y2="292"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="4 3">
    <rect x="22" y="204" width="208" height="22" rx="5"/>
    <rect x="386" y="354" width="408" height="22" rx="5"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#lme-arrow)">
    <path d="M242,176 H300 V170 H374"/>
    <path d="M242,176 H300 V320 H374"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="306" y="150">sum by=</text>
    <text x="306" y="164">groups</text>
    <text x="306" y="300">at by=</text>
    <text x="306" y="314">looks up</text>
  </g>
  <g font-size="12">
    <rect x="16" y="408" width="14" height="12" rx="2" fill="#0072B2" fill-opacity="0.2" stroke="currentColor" stroke-width="0.8"/>
    <text x="36" y="418" fill="currentColor">data the file is given</text>
    <rect x="190" y="408" width="14" height="12" rx="2" fill="#009E73" fill-opacity="0.2" stroke="currentColor" stroke-width="0.8"/>
    <text x="210" y="418" fill="currentColor">a constraint or an expression</text>
    <rect x="410" y="408" width="14" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="0.8" stroke-dasharray="3 2"/>
    <text x="430" y="418" fill="currentColor">absent: no row</text>
  </g>
</svg>
