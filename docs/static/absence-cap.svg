<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 861 268" width="861" height="268" style="max-width: 100%; height: auto" role="img" aria-labelledby="acap-t acap-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="acap-t">A missing parameter row and an absent variable affect a row differently</title>
  <desc id="acap-d">The variable y has rows for wind and gas, and no row for old, where capacity is 0. The parameter rel_max, with missing neutral, is 0.5 for wind and 0.9 for old, and has no row for gas. The constraint cap has a row for wind, x of wind minus 0.5 times y of wind at most 0, and a row for gas, x of gas at most 0. It has no row for old, because y is absent there.</desc>
  <defs>
    <pattern id="acap-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D55E00" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
    <marker id="acap-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,56 H210.2 V97 A3,3 0 0 1 207.2,100 H19 A3,3 0 0 1 16,97 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,56 V37 A3,3 0 0 1 19,34 H207.2 A3,3 0 0 1 210.2,37 V56 Z" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="24" font-weight="bold">y</text>
    <text x="34" y="24" fill-opacity="0.7">a variable</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="48" font-weight="bold">generator</text>
      <text x="24" y="72">wind</text>
      <text x="24" y="90">gas</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="34" width="194" height="66" rx="3"/>
    <line x1="16" y1="56" x2="210" y2="56"/>
    <rect x="16" y="104" width="194" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="24" y="120" fill-opacity="0.7" font-style="italic">no row for old: y is absent</text>
  </g>
  <g stroke="none">
    <path d="M16,194 H171.0 V253 A3,3 0 0 1 168.0,256 H19 A3,3 0 0 1 16,253 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,194 V175 A3,3 0 0 1 19,172 H168.0 A3,3 0 0 1 171.0,175 V194 Z" fill="#0072B2" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="162" font-weight="bold">rel_max</text>
    <text x="79" y="162" fill-opacity="0.7">a parameter</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="186" font-weight="bold">generator</text>
      <text x="112" y="186" font-weight="bold">value</text>
      <text x="24" y="210">wind</text><text x="112" y="210">0.5</text>
      <text x="24" y="228">gas</text><text x="112" y="228">—</text>
      <text x="24" y="246">old</text><text x="112" y="246">0.9</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="172" width="155" height="84" rx="3"/>
    <line x1="16" y1="194" x2="171" y2="194"/>
    <rect x="17" y="215" width="153" height="19" fill="url(#acap-hatch)" stroke="none"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2">
    <path d="M216,78 H220.2"/>
    <path d="M177,225 H220.2"/>
    <path d="M220.2,78 V225"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#acap-arrow)">
    <path d="M220.2,145.0 L380.2,145.0"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="232" y="139">cap</text>
    <text x="232" y="161" fill-opacity="0.7">rel_max is 0 where</text>
    <text x="232" y="176" fill-opacity="0.7">it has no row</text>
  </g>
  <g stroke="none">
    <path d="M392.2,123.0 H706.3 V164.0 A3,3 0 0 1 703.3,167.0 H395.2 A3,3 0 0 1 392.2,164.0 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M392.2,123.0 V104.0 A3,3 0 0 1 395.2,101.0 H703.3 A3,3 0 0 1 706.3,104.0 V123.0 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="392.2" y="91.0" font-weight="bold">cap</text>
    <text x="425" y="91.0" fill-opacity="0.7">a constraint</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="400" y="115.0" font-weight="bold">generator</text>
      <text x="488" y="115.0" font-weight="bold">row</text>
      <text x="400" y="139.0">wind</text><text x="488" y="139.0">x[wind] − 0.5 · y[wind] &lt;= 0</text>
      <text x="400" y="157.0">gas</text><text x="488" y="157.0">x[gas] &lt;= 0</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="392.2" y="101.0" width="314" height="66" rx="3"/>
    <line x1="392.2" y1="123.0" x2="706" y2="123.0"/>
    <rect x="392.2" y="171.0" width="314" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="400.2" y="187.0" fill-opacity="0.7" font-style="italic">no row for old: cap is absent</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="732" y="40" width="14" height="14" fill="url(#acap-hatch)"/>
    <rect x="732" y="64" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="752" y="51">no data</text>
    <text x="752" y="75">absent: no row</text>
  </g>
</svg>
