<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 420" width="820" height="420" style="max-width: 100%; height: auto" role="img" aria-labelledby="lma-t lma-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="lma-t">A lookup through a relation is a join with one row per key</title>
  <desc id="lma-d">The parameter zone_cap has a value at each snapshot, 0 and 1, and each zone, north and south: 5 and 2 at snapshot 0, 6 and 3 at snapshot 1. The relation gen_zone, keyed by generator and snapshot, puts wind in zone north at both snapshots, and gas in zone north at snapshot 0 and in zone south at snapshot 1. The lookup joins each row of gen_zone with the row of zone_cap that has the same snapshot and zone. The result has one row per row of gen_zone: at snapshot 0, wind and gas both take 5, the value at north. At snapshot 1, wind takes 6, the value at north, and gas takes 3, the value at south. No row of the result takes the value 2 at snapshot 0 and zone south.</desc>
  <defs>
    <marker id="lma-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,178 H226 V253 A3,3 0 0 1 223,256 H19 A3,3 0 0 1 16,253 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,178 V159 A3,3 0 0 1 19,156 H223 A3,3 0 0 1 226,159 V178 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M16,318 H226 V393 A3,3 0 0 1 223,396 H19 A3,3 0 0 1 16,393 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,318 V299 A3,3 0 0 1 19,296 H223 A3,3 0 0 1 226,299 V318 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M330,262 H630 V337 A3,3 0 0 1 627,340 H333 A3,3 0 0 1 330,337 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M330,262 V243 A3,3 0 0 1 333,240 H627 A3,3 0 0 1 630,243 V262 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12.5">
      <text x="16" y="28">relations:</text>
      <text x="31" y="46">gen_zone: { key: [generator, snapshot], values: zone, missing: absent }</text>
      <text x="16" y="64">parameters:</text>
      <text x="31" y="82">zone_cap: { dims: [snapshot, zone] }</text>
      <text x="16" y="106" font-weight="bold">at(zone_cap, by=gen_zone[zone])</text>
    </g>
    <text x="16" y="146" font-weight="bold">zone_cap</text>
    <text x="84" y="146" fill-opacity="0.7">a parameter</text>
    <text x="16" y="286" font-weight="bold">gen_zone</text>
    <text x="84" y="286" fill-opacity="0.7">a relation</text>
    <text x="330" y="230" font-weight="bold">the result</text>
    <text x="404" y="230" fill-opacity="0.7">an expression</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="170" font-weight="bold">snapshot</text>
      <text x="104" y="170" font-weight="bold">zone</text>
      <text x="176" y="170" font-weight="bold">value</text>
      <text x="24" y="194">0</text><text x="104" y="194">north</text><text x="176" y="194">5</text>
      <text x="24" y="212">0</text><text x="104" y="212">south</text><text x="176" y="212">2</text>
      <text x="24" y="230">1</text><text x="104" y="230">north</text><text x="176" y="230">6</text>
      <text x="24" y="248">1</text><text x="104" y="248">south</text><text x="176" y="248">3</text>
      <text x="24" y="310" font-weight="bold">generator</text>
      <text x="104" y="310" font-weight="bold">snapshot</text>
      <text x="176" y="310" font-weight="bold">zone</text>
      <text x="24" y="334">wind</text><text x="104" y="334">0</text><text x="176" y="334">north</text>
      <text x="24" y="352">gas</text><text x="104" y="352">0</text><text x="176" y="352">north</text>
      <text x="24" y="370">wind</text><text x="104" y="370">1</text><text x="176" y="370">north</text>
      <text x="24" y="388">gas</text><text x="104" y="388">1</text><text x="176" y="388">south</text>
      <text x="338" y="254" font-weight="bold">snapshot</text>
      <text x="410" y="254" font-weight="bold">generator</text>
      <text x="490" y="254" font-weight="bold">zone</text>
      <text x="560" y="254" font-weight="bold">value</text>
      <text x="338" y="278">0</text><text x="410" y="278">wind</text><text x="490" y="278">north</text><text x="560" y="278">5</text>
      <text x="338" y="296">0</text><text x="410" y="296">gas</text><text x="490" y="296">north</text><text x="560" y="296">5</text>
      <text x="338" y="314">1</text><text x="410" y="314">wind</text><text x="490" y="314">north</text><text x="560" y="314">6</text>
      <text x="338" y="332">1</text><text x="410" y="332">gas</text><text x="490" y="332">south</text><text x="560" y="332">3</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="156" width="210" height="100" rx="3"/>
    <line x1="16" y1="178" x2="226" y2="178"/>
    <rect x="16" y="296" width="210" height="100" rx="3"/>
    <line x1="16" y1="318" x2="226" y2="318"/>
    <rect x="330" y="240" width="300" height="100" rx="3"/>
    <line x1="330" y1="262" x2="630" y2="262"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#lma-arrow)">
    <path d="M236,206 C290,206 270,280 300,280 H324"/>
    <path d="M236,346 C290,346 270,310 300,310 H324"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="246" y="182">join on snapshot</text>
    <text x="246" y="197">and zone</text>
    <text x="246" y="372">one row per</text>
    <text x="246" y="387">row of gen_zone</text>
  </g>
</svg>
