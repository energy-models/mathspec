<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 138" width="760" height="138" style="max-width: 100%; height: auto" role="img" aria-labelledby="agd-t agd-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="agd-t">A guard leaves out the row whose divisor is 0</title>
  <desc id="agd-d">The parameter c, declared missing: 0, is a table with rows wind 4 and gas 2. It has no data for old, so c is 0 there. The constraint per_unit, with where c greater than zero, has two rows: y at wind is at most d at wind divided by 4, and y at gas is at most d at gas divided by 2. The row for old is absent, so nothing divides by 0.</desc>
  <defs>
    <pattern id="agd-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D55E00" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
    <marker id="agd-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g transform="translate(0,-98)">
  <g stroke="none">
    <path d="M16,154 H176 V211 A3,3 0 0 1 173,214 H19 A3,3 0 0 1 16,211 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,154 V135 A3,3 0 0 1 19,132 H173 A3,3 0 0 1 176,135 V154 Z" fill="#0072B2" fill-opacity="0.2"/>
    <path d="M324,154 H574 V193 A3,3 0 0 1 571,196 H327 A3,3 0 0 1 324,193 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M324,154 V135 A3,3 0 0 1 327,132 H571 A3,3 0 0 1 574,135 V154 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="122" font-weight="bold">c</text>
    <text x="30" y="122" fill-opacity="0.7">a parameter, missing: 0</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="146" font-weight="bold">g</text>
      <text x="110" y="146" font-weight="bold">value</text>
      <text x="24" y="170">wind</text><text x="110" y="170">4</text>
      <text x="24" y="188">gas</text><text x="110" y="188">2</text>
      <text x="24" y="206">old</text><text x="110" y="206">0</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="132" width="160" height="82" rx="3"/>
    <line x1="16" y1="154" x2="176" y2="154"/>
    <rect x="17" y="193" width="158" height="20" fill="url(#agd-hatch)" stroke="none"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#agd-arrow)">
    <path d="M186,176 L312,176"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="198" y="164">where: c &gt; 0</text>
    <text x="198" y="194" fill-opacity="0.7">keeps a row only</text>
    <text x="198" y="209" fill-opacity="0.7">where it is true</text>
  </g>
  <g fill="currentColor">
    <text x="324" y="122" font-weight="bold">per_unit</text>
    <text x="390" y="122" fill-opacity="0.7">a constraint</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="332" y="146" font-weight="bold">g</text>
      <text x="380" y="146" font-weight="bold">row</text>
      <text x="332" y="170">wind</text><text x="380" y="170">y[wind] &lt;= d[wind] / 4</text>
      <text x="332" y="188">gas</text><text x="380" y="188">y[gas] &lt;= d[gas] / 2</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="324" y="132" width="250" height="64" rx="3"/>
    <line x1="324" y1="154" x2="574" y2="154"/>
    <rect x="324" y="200" width="250" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="332" y="216" fill-opacity="0.7" font-style="italic">no row for old: no division by 0</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="600" y="138" width="14" height="14" fill="url(#agd-hatch)"/>
    <rect x="600" y="162" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="620" y="149">no data, so 0</text>
    <text x="620" y="173">absent: no row</text>
  </g>
  </g>
</svg>
