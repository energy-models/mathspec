  <title
     id="hst-t">From Calliope to mathspec</title>
  <desc
     id="hst-d">A timeline in four rows, one per project: Calliope, specsolve, mathspec and fluxopt. The time axis shows one step per year from 2020 to 2025, then one step per month in 2026. In the Calliope row: in August 2020, discussions on YAML math begin; in May 2021, the goal is set to state every constraint in YAML; in February 2023, the parser lands; in 2023, users can replace the math with their own file, the math documentation is generated and a schema validates the math files; in January 2024, 0.7.0.dev2 ships with all of its math in YAML; from 2024 to 2026, Calliope adds piecewise constraints, solver engines, dispatch and MGA math, and post-solve expressions; in September 2026, Calliope 0.7.0 is released. In March 2026, specsolve starts as lpspec, with a language that keeps Calliope's shape. In August 2026, the language and the typesetter are extracted from specsolve into mathspec, and the PyPSA math is written as a spec. In September 2026, mathspec 0.1.0 is on PyPI, specsolve depends on it, the Calliope math is ported to a spec, and fluxopt math is written as a spec.</desc>
