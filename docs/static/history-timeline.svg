<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 426" width="1000" height="426" style="max-width: 100%; height: auto" role="img" aria-labelledby="hst-t hst-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">
  <title id="hst-t">From Calliope to mathspec</title>
  <desc id="hst-d">A timeline in four rows, one per project: Calliope, specsolve, mathspec and fluxopt. The time axis shows one step per year from 2018 to 2025, then one step per month in 2026. In the Calliope row: in April 2018, Calliope 0.6.0 removes custom constraints in YAML; in March 2021, foreach and where move into a YAML file; in May 2021, the goal is set to state every constraint in YAML; in February 2023, the parser lands; in 2023, users can replace the math with their own file and the math documentation is generated; in January 2024, 0.7.0.dev2 ships with the whole formulation in YAML; in 2024, piecewise constraints arrive; in September 2026, Calliope 0.7.0 is released. In March 2026, specsolve starts, with a language that keeps Calliope's shape. In August 2026, the language and the typesetter are extracted from specsolve into mathspec, and the PyPSA ladder starts. In September 2026, mathspec 0.1 is on PyPI and 0.2 follows, specsolve depends on mathspec 0.1 and then 0.2, and a port of the math of Calliope 0.7.0 opens in mathspec. Also in September 2026, fluxopt states its model as a spec. In October 2026, mathspec 0.2.1 composes files, 0.3 adds relations and 0.4 adds conditions, and fluxopt installs mathspec 0.2.1, with a spec per system that holds only the fragments its elements use. The rows overlap: specsolve starts six months before Calliope 0.7.0 is released, and mathspec's first releases, specsolve's dependency on them and fluxopt's spec come in the same month as Calliope 0.7.0.</desc>
