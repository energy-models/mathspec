<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 695 184" width="695" height="184" style="max-width: 100%; height: auto" role="img" aria-labelledby="oso-t oso-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="oso-t">A parameter as offset shifts each technology by its own lead</title>
  <desc id="oso-d">The variable order has six rows, technologies wind and gas at months 1, 2 and 3. The parameter lead is 1 for wind and 2 for gas. shift of order along month, with offset lead and edge 0, has six rows. Wind reads one month back, so it is 0 at month 1, order of wind at 1 at month 2, and order of wind at 2 at month 3. Gas reads two months back, so it is 0 at months 1 and 2, and order of gas at 1 at month 3.</desc>
  <defs>
    <pattern id="oso-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D55E00" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
    <marker id="oso-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g stroke="none">
    <path d="M16,56 H169.5 V169 A3,3 0 0 1 166.5,172 H19 A3,3 0 0 1 16,169 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M16,56 V37 A3,3 0 0 1 19,34 H166.5 A3,3 0 0 1 169.5,37 V56 Z" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="24" font-weight="bold">order</text>
    <text x="64" y="24" fill-opacity="0.7">a variable</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="48" font-weight="bold">technology</text>
      <text x="119" y="48" font-weight="bold">month</text>
      <text x="24" y="72">wind</text><text x="119" y="72">1</text>
      <text x="24" y="90">wind</text><text x="119" y="90">2</text>
      <text x="24" y="108">wind</text><text x="119" y="108">3</text>
      <text x="24" y="126">gas</text><text x="119" y="126">1</text>
      <text x="24" y="144">gas</text><text x="119" y="144">2</text>
      <text x="24" y="162">gas</text><text x="119" y="162">3</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="34" width="154" height="138" rx="3"/>
    <line x1="16" y1="56" x2="170" y2="56"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#oso-arrow)">
    <path d="M179.5,114.0 L395.5,114.0"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="192" y="108">shift(offset=lead, edge=0)</text>
    <text x="192" y="130" fill-opacity="0.7">lead: wind 1, gas 2</text>
  </g>
  <g stroke="none">
    <path d="M407.5,56 H685.2 V169 A3,3 0 0 1 682.2,172 H410.5 A3,3 0 0 1 407.5,169 Z" fill="#009E73" fill-opacity="0.08"/>
    <path d="M407.5,56 V37 A3,3 0 0 1 410.5,34 H682.2 A3,3 0 0 1 685.2,37 V56 Z" fill="#009E73" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="407.5" y="24" font-weight="bold">shift(order, …)</text>
    <text x="532" y="24" fill-opacity="0.7">an operator result</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="416" y="48" font-weight="bold">technology</text>
      <text x="510" y="48" font-weight="bold">month</text>
      <text x="569" y="48" font-weight="bold">value</text>
      <text x="416" y="72">wind</text><text x="510" y="72">1</text><text x="569" y="72">0</text>
      <text x="416" y="90">wind</text><text x="510" y="90">2</text><text x="569" y="90">order[wind, 1]</text>
      <text x="416" y="108">wind</text><text x="510" y="108">3</text><text x="569" y="108">order[wind, 2]</text>
      <text x="416" y="126">gas</text><text x="510" y="126">1</text><text x="569" y="126">0</text>
      <text x="416" y="144">gas</text><text x="510" y="144">2</text><text x="569" y="144">0</text>
      <text x="416" y="162">gas</text><text x="510" y="162">3</text><text x="569" y="162">order[gas, 1]</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="407.5" y="34" width="278" height="138" rx="3"/>
    <line x1="407.5" y1="56" x2="685" y2="56"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
  </g>
  <g fill="currentColor" font-size="12">
  </g>
</svg>
