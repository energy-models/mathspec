    <line x1="16" y1="60" x2="216" y2="60"/>
    <rect x="16" y="160" width="200" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
    <rect x="16" y="228" width="200" height="118" rx="3"/>
    <line x1="16" y1="250" x2="216" y2="250"/>
    <rect x="16" y="350" width="200" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
    <rect x="380" y="130" width="304" height="118" rx="3"/>
    <line x1="380" y1="152" x2="684" y2="152"/>
    <rect x="380" y="252" width="304" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12" font-style="italic" fill-opacity="0.7">
    <text x="24" y="176">no row for coal at bp 2</text>
    <text x="24" y="366">no row for coal at bp 2</text>
    <text x="388" y="268">no bp 2 for coal: its curve stops at bp 1</text>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#pwp-arrow)">
    <path d="M226,100 C300,100 300,180 350,180 H374"/>
    <path d="M226,290 C300,290 300,216 350,216 H374"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="232" y="62">points: bp_x</text>
    <text x="232" y="77" fill-opacity="0.7">the curve runs where</text>
    <text x="232" y="92" fill-opacity="0.7">bp_x has a row</text>
    <text x="232" y="310">link: op_cost</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="380" y="300" width="14" height="14" fill="#0072B2" fill-opacity="0.2"/>
    <rect x="380" y="324" width="14" height="14" fill="#009E73" fill-opacity="0.2"/>
    <rect x="380" y="348" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="400" y="311">data the file is given</text>
    <text x="400" y="335">an entry that adds constraint rows</text>
    <text x="400" y="359">absent: no row</text>
  </g>
</svg>
