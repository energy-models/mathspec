<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 906 138" width="906" height="138" style="max-width: 100%; height: auto" role="img" aria-labelledby="eat-t eat-d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">
  <title id="eat-t">at in a condition reads a condition through a relation</title>
  <desc id="eat-d">The relation converter_of maps flows f1 and f2 to converter c1 and flow f3 to converter c2. The parameter has_curve is true at c1 and false at c2. The variable rate, declared with where at of has_curve by converter_of converter, is a table with two rows, f1 and f2. The converter of f3 has no curve, so rate has no row for f3 and is absent there.</desc>
  <defs>
    <pattern id="eat-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#D55E00" stroke-opacity="0.5" stroke-width="1.5"/>
    </pattern>
    <marker id="eat-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="currentColor"/>
    </marker>
  </defs>
  <g transform="translate(0,-98)">
  <g stroke="none">
    <path d="M16,154 H266 V211 A3,3 0 0 1 263,214 H19 A3,3 0 0 1 16,211 Z" fill="#0072B2" fill-opacity="0.08"/>
    <path d="M16,154 V135 A3,3 0 0 1 19,132 H263 A3,3 0 0 1 266,135 V154 Z" fill="#0072B2" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="16" y="122" font-weight="bold">converter_of</text>
    <text x="117" y="122" fill-opacity="0.7">a relation, with has_curve</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="24" y="146" font-weight="bold">flow</text><text x="76" y="146" font-weight="bold">converter</text><text x="166" y="146" font-weight="bold">has_curve</text>
      <text x="24" y="170">f1</text><text x="76" y="170">c1</text><text x="166" y="170">true</text>
      <text x="24" y="188">f2</text><text x="76" y="188">c1</text><text x="166" y="188">true</text>
      <text x="24" y="206">f3</text><text x="76" y="206">c2</text><text x="166" y="206">false</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="16" y="132" width="250" height="82" rx="3"/>
    <line x1="16" y1="154" x2="266" y2="154"/>
    <rect x="17" y="193" width="248" height="18" fill="url(#eat-hatch)" stroke="none"/>
  </g>
  <g stroke="currentColor" fill="none" stroke-width="1.2" marker-end="url(#eat-arrow)">
    <path d="M276,176 L488,176"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="288" y="149">where: "at(has_curve,</text>
    <text x="288" y="164">by=converter_of[converter])"</text>
    <text x="288" y="194" fill-opacity="0.7">keeps a flow whose</text>
    <text x="288" y="209" fill-opacity="0.7">converter has a curve</text>
  </g>
  <g stroke="none">
    <path d="M500,154 H730 V193 A3,3 0 0 1 727,196 H503 A3,3 0 0 1 500,193 Z" fill="#E69F00" fill-opacity="0.08"/>
    <path d="M500,154 V135 A3,3 0 0 1 503,132 H727 A3,3 0 0 1 730,135 V154 Z" fill="#E69F00" fill-opacity="0.2"/>
  </g>
  <g fill="currentColor">
    <text x="500" y="122" font-weight="bold">rate</text>
    <text x="540" y="122" fill-opacity="0.7">a variable</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12">
      <text x="508" y="146" font-weight="bold">flow</text>
      <text x="508" y="170">f1</text>
      <text x="508" y="188">f2</text>
    </g>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="500" y="132" width="230" height="64" rx="3"/>
    <line x1="500" y1="154" x2="730" y2="154"/>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="500" y="200" width="230" height="24" rx="3" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="508" y="216" fill-opacity="0.7" font-style="italic">no row for f3: rate is absent</text>
  </g>
  <g fill="none" stroke="currentColor" stroke-width="1">
    <rect x="756" y="138" width="14" height="14" fill="url(#eat-hatch)"/>
    <rect x="756" y="162" width="14" height="14" stroke-dasharray="4 3" stroke-opacity="0.6"/>
  </g>
  <g fill="currentColor" font-size="12">
    <text x="776" y="149">condition is false</text>
    <text x="776" y="173">absent: no row</text>
  </g>
  </g>
</svg>
