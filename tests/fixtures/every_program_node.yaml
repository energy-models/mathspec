description: every node a program can carry, in one file that lowers
dimensions:
  t: { dtype: int, ordered: true }
  g: { dtype: str }
  zone: { dtype: str }
  site: { over: [g, zone] } # a multi-dimension: a frame meets it through a Reframe
relations:
  zone_of: { key: g, values: zone }
parameters:
  cost: { dims: [g] }
  load: { dims: [zone] }
  rate: { dims: [] }
  lead: { dims: [g], dtype: int }
  width: { dims: [g], dtype: int }
variables:
  p: { dims: [t, g], bounds: { lower: 0, upper: 100 } }
  q: { dims: [zone], bounds: { lower: 0, upper: 100 } }
  r: { dims: [site, t], bounds: { lower: 0, upper: cost } }
  s: { dims: [g, t, zone], where: site, bounds: { lower: 0, upper: 100 } }
expressions:
  by_region:
    dims: [t, g]
    cases:
      opening: { when: "position(t) == 0", expression: 0 }
    otherwise: shift(p, along=t, offset=1, edge='wrap')
  shadow: dual(grouped) # a Dual leaf, the one node only an entry the math never reads lowers to
constraints:
  sited:
    dims: [t, zone]
    expression: "sum(r, over=g) + sum(s, over=g) <= load"
  regional:
    dims: [t, g]
    expression: "p - by_region <= 0"
  arithmetic:
    dims: [t, g]
    expression: "-p + p * cost - p / cost + rate ** 2 <= 1"
  reduced:
    dims: []
    expression: "sum(p) >= 0"
  grouped:
    dims: [t, zone]
    expression: "sum(p, over=g, by=zone_of[zone]) - q <= load"
  looked_up:
    dims: [t, g]
    expression: "p - at(q, by=zone_of[zone]) <= 0"
  translated:
    dims: [t, g]
    expression: "p - shift(p, along=t, offset=lead, edge='wrap') <= 0"
  windowed:
    dims: [t, g]
    expression: "sum_back(p, along=t, window=width) <= 10"
objective:
  sense: minimize
  expression: "sum(p * cost)"
