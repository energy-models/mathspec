# libraries/basic_models_library.yml, lines 21-52
- id: bus
  parameters:
    - id: spillage_cost
    - id: unsupplied_energy_cost
  variables:
    - id: spillage
      lower-bound: 0
      variable-type: continuous
    - id: unsupplied_energy
      lower-bound: 0
      variable-type: continuous
  ports:
    - id: balance_port
      type: flow
  binding-constraints:
    - id: balance
      expression: sum_connections(balance_port.flow) = spillage - unsupplied_energy
  objective-contributions:
    - id: objective
      expression: sum(spillage_cost * spillage + unsupplied_energy_cost * unsupplied_energy)
- id: load
  parameters:
    - id: load
      time-dependent: true
      scenario-dependent: true
  ports:
    - id: balance_port
      type: flow
  port-field-definitions:
    - port: balance_port
      field: flow
      definition: -load
