dimensions:
  bp: { dtype: int, ordered: true }

parameters:
  x_bp: { dims: [bp], missing: 0 }
  y_bp: { dims: [bp], missing: 0 }

variables:
  x: { dims: [], bounds: { lower: 0 } }
  y: { dims: [], bounds: { lower: 0 } }

piecewise:
  curve:
    over: bp
    method: lp
    points: x_bp
    links:
      - [x, x_bp]
      - [y, y_bp, ">="]
