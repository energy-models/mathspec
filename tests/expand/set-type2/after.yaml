dimensions:
  g: { dtype: str, ordered: true }

variables:
  p:
    dims: [g]
    bounds: { lower: 0, upper: 10 }
  pick_seg:
    dims: [g]
    domain: binary
    description: a binary per segment, 1 where the two members it spans may be nonzero

constraints:
  pick_pick:
    dims: []
    expression: sum(pick_seg, over=g) <= 1
  pick_adjacency:
    dims: [g]
    expression: p <= 10.0 * (sum_back(pick_seg, along=g, window=2))
